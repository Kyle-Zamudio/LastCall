<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LastCall - Shift Coverage in Minutes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' }

        }
      }
    }
  </script>
  <style>

    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Supabase client
    const SUPABASE_URL = 'https://thugeejicutetunygyta.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRodWdlZWppY3V0ZXR1bnlneXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwMTMxMDksImV4cCI6MjA4MjU4OTEwOX0.UnHee0ZNThJkbBjBIjEe61wfKIs_2TKLKGqAw36oFW8';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // Simple hash function for passwords (in production, use proper auth)
    const hashPassword = async (password) => {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    // POS Systems list
    const POS_SYSTEMS = ['Toast', 'Square', 'Aloha', 'Micros', 'TouchBistro', 'Clover', 'Revel', 'Lightspeed', 'SpotOn', 'Other'];
    const POSITIONS = ['Bartender', 'Server', 'Cook', 'Dishwasher', 'Host', 'Barback'];
    const CERTIFICATIONS = ['TIPS', 'ServSafe', 'Food Handlers Card', 'ABC License', 'None'];

    // Logo Component
    const Logo = ({ size = "default" }) => {
      const sizes = {
        small: { box: "w-10 h-10", icon: "w-5 h-5" },
        default: { box: "w-16 h-16", icon: "w-8 h-8" },
        large: { box: "w-20 h-20", icon: "w-10 h-10" }
      };
      return (
        <div className={`${sizes[size].box} bg-gradient-to-br from-brand-500 to-brand-700 rounded-2xl flex items-center justify-center shadow-lg shadow-brand-500/30`}>
          <svg className={`${sizes[size].icon} text-white`} fill="currentColor" viewBox="0 0 24 24">
            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
          </svg>
        </div>
      );
    };

    // Main App
    function App() {
      const [view, setView] = useState('landing'); // landing, business-auth, worker-auth, business-dashboard, worker-dashboard
      const [authMode, setAuthMode] = useState('login'); // login, signup
      const [user, setUser] = useState(null); // Current logged in user
      const [userType, setUserType] = useState(null); // 'business' or 'worker'
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');

      // Check for saved session
      useEffect(() => {
        const savedUser = localStorage.getItem('lastcall_user');
        const savedType = localStorage.getItem('lastcall_type');
        if (savedUser && savedType) {
          setUser(JSON.parse(savedUser));
          setUserType(savedType);
          setView(savedType === 'business' ? 'business-dashboard' : 'worker-dashboard');
        }
      }, []);

      const logout = () => {
        localStorage.removeItem('lastcall_user');
        localStorage.removeItem('lastcall_type');
        setUser(null);
        setUserType(null);
        setView('landing');
      };

      // Landing Page
      if (view === 'landing') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-brand-900 flex flex-col items-center justify-center p-6">
            <div className="text-center mb-12 flex flex-col items-center">
              <Logo size="large" />
              <h1 className="text-5xl font-bold text-white mt-6 mb-2 tracking-tight">
                Last<span className="text-brand-400">Call</span>
              </h1>
              <p className="text-slate-400 text-lg">Shift coverage in minutes, not hours</p>
            </div>
            
            <div className="w-full max-w-md space-y-4">
              <button
                onClick={() => { setUserType('worker'); setView('worker-auth'); setAuthMode('login'); }}
                className="w-full bg-white hover:bg-slate-50 text-slate-800 rounded-2xl p-5 flex items-center gap-4 transition-all shadow-xl"
              >
                <div className="w-12 h-12 bg-slate-200 rounded-xl flex items-center justify-center">
                  <svg className="w-6 h-6 text-slate-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                  </svg>
                </div>
                <div className="text-left">
                  <div className="font-semibold text-lg">I'm a Worker</div>
                  <div className="text-slate-500 text-sm">Pick up shifts nearby</div>
                </div>
              </button>
              
              <button
                onClick={() => { setUserType('business'); setView('business-auth'); setAuthMode('login'); }}
                className="w-full bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white rounded-2xl p-5 flex items-center gap-4 transition-all shadow-xl"
              >
                <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                  <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>
                  </svg>
                </div>
                <div className="text-left">
                  <div className="font-semibold text-lg">I'm a Business</div>
                  <div className="text-white/80 text-sm">Find coverage fast</div>
                </div>
              </button>
            </div>
            
            <div className="mt-12 text-center">
              <p className="text-slate-500 text-sm">✓ Free for workers</p>
              <p className="text-slate-500 text-sm">✓ No commission on wages</p>
              <p className="text-slate-500 text-sm">✓ Same-day coverage</p>
            </div>
            
            <div className="absolute bottom-4 text-slate-600 text-sm">
              Need help? Text <a href="sms:8084455890" className="text-brand-400 hover:text-brand-300">808-445-5890</a>
            </div>
          </div>
        );
      }

      // Business Auth
      if (view === 'business-auth') {
        return <BusinessAuth 
          mode={authMode} 
          setMode={setAuthMode} 
          setView={setView} 
          setUser={setUser}
          onBack={() => setView('landing')}
        />;
      }

      // Worker Auth
      if (view === 'worker-auth') {
        return <WorkerAuth 
          mode={authMode} 
          setMode={setAuthMode} 
          setView={setView} 
          setUser={setUser}
          onBack={() => setView('landing')}
        />;
      }

      // Business Dashboard
      if (view === 'business-dashboard') {
        return <BusinessDashboard user={user} onLogout={logout} />;
      }

      // Worker Dashboard
      if (view === 'worker-dashboard') {
        return <WorkerDashboard user={user} onLogout={logout} />;
      }

      // Forgot Password - Business
      if (view === 'forgot-password-business') {
        return <ForgotPassword userType="business" setView={setView} />;
      }

      // Forgot Password - Worker
      if (view === 'forgot-password-worker') {
        return <ForgotPassword userType="worker" setView={setView} />;
      }

      // Reset Password - Business
      if (view === 'reset-password-business') {
        return <ResetPassword userType="business" setView={setView} />;
      }

      // Reset Password - Worker
      if (view === 'reset-password-worker') {
        return <ResetPassword userType="worker" setView={setView} />;
      }

      return null;
    }

    // Business Auth Component
    function BusinessAuth({ mode, setMode, setView, setUser, onBack }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [businessName, setBusinessName] = useState('');
      const [address, setAddress] = useState('');
      const [phone, setPhone] = useState('');
      const [posSystem, setPosSystem] = useState('');
      const [menuNotes, setMenuNotes] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        try {
          const passwordHash = await hashPassword(password);

          if (mode === 'signup') {
            const { data, error: insertError } = await supabase
              .from('businesses')
              .insert([{
                email,
                password_hash: passwordHash,
                business_name: businessName,
                address,
                phone,
                pos_system: posSystem,
                menu_notes: menuNotes
              }])
              .select()
              .single();

            if (insertError) {
              if (insertError.code === '23505') {
                setError('Email already registered. Please log in.');
              } else {
                setError(insertError.message);
              }
              setLoading(false);
              return;
            }

            localStorage.setItem('lastcall_user', JSON.stringify(data));
            localStorage.setItem('lastcall_type', 'business');
            setUser(data);
            setView('business-dashboard');
          } else {
            const { data, error: selectError } = await supabase
              .from('businesses')
              .select('*')
              .eq('email', email)
              .eq('password_hash', passwordHash)
              .single();

            if (selectError || !data) {
              setError('Invalid email or password');
              setLoading(false);
              return;
            }

            localStorage.setItem('lastcall_user', JSON.stringify(data));
            localStorage.setItem('lastcall_type', 'business');
            setUser(data);
            setView('business-dashboard');
          }
        } catch (err) {
          setError('Something went wrong. Please try again.');
        }
        setLoading(false);
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-brand-900 flex flex-col items-center justify-center p-6">
          <button onClick={onBack} className="absolute top-4 left-4 text-slate-400 hover:text-white flex items-center gap-2">
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
            Back
          </button>

          <div className="w-full max-w-md">
            <div className="text-center mb-8 flex flex-col items-center">
              <Logo />
              <h2 className="text-2xl font-bold text-white mt-4">
                {mode === 'login' ? 'Business Login' : 'Register Your Business'}
              </h2>
            </div>

            <form onSubmit={handleSubmit} className="bg-slate-800 rounded-2xl p-6 space-y-4">
              {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm">{error}</div>}

              <div>
                <label className="text-slate-300 text-sm">Email</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              {mode === 'signup' && (
                <>
                  <div>
                    <label className="text-slate-300 text-sm">Business Name</label>
                    <input
                      type="text"
                      value={businessName}
                      onChange={(e) => setBusinessName(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                      required
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">Address</label>
                    <input
                      type="text"
                      value={address}
                      onChange={(e) => setAddress(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                      placeholder="123 Main St, City, State"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">Phone</label>
                    <input
                      type="tel"
                      value={phone}
                      onChange={(e) => setPhone(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">POS System</label>
                    <select
                      value={posSystem}
                      onChange={(e) => setPosSystem(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    >
                      <option value="">Select POS System</option>
                      {POS_SYSTEMS.map(pos => <option key={pos} value={pos}>{pos}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">Menu Notes (optional)</label>
                    <textarea
                      value={menuNotes}
                      onChange={(e) => setMenuNotes(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                      rows={3}
                      placeholder="Describe your menu, signature items, etc."
                    />
                  </div>
                </>
              )}

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-semibold py-3 rounded-xl transition-all disabled:opacity-50"
              >
                {loading ? 'Please wait...' : (mode === 'login' ? 'Log In' : 'Create Account')}
              </button>

              <p className="text-center text-slate-400 text-sm">
                {mode === 'login' ? "Don't have an account? " : "Already have an account? "}
                <button
                  type="button"
                  onClick={() => setMode(mode === 'login' ? 'signup' : 'login')}
                  className="text-brand-400 hover:text-brand-300"
                >
                  {mode === 'login' ? 'Sign up' : 'Log in'}
                </button>
              </p>
              {mode === 'login' && (
                <p className="text-center">
                  <button
                    type="button"
                    onClick={() => setView('forgot-password-business')}
                    className="text-slate-500 hover:text-slate-400 text-sm"
                  >
                    Forgot password?
                  </button>
                </p>
              )}
            </form>
          </div>
        </div>
      );
    }

    // Worker Auth Component
    function WorkerAuth({ mode, setMode, setView, setUser, onBack }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [phone, setPhone] = useState('');
      const [selectedPOS, setSelectedPOS] = useState([]);
      const [selectedPositions, setSelectedPositions] = useState([]);
      const [yearsExperience, setYearsExperience] = useState('');
      const [selectedCerts, setSelectedCerts] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const toggleSelection = (item, selected, setSelected) => {
        if (selected.includes(item)) {
          setSelected(selected.filter(i => i !== item));
        } else {
          setSelected([...selected, item]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        try {
          const passwordHash = await hashPassword(password);

          if (mode === 'signup') {
            if (selectedPositions.length === 0) {
              setError('Please select at least one position');
              setLoading(false);
              return;
            }

            const { data, error: insertError } = await supabase
              .from('workers')
              .insert([{
                email,
                password_hash: passwordHash,
                full_name: fullName,
                phone,
                pos_systems: selectedPOS,
                positions: selectedPositions,
                years_experience: parseInt(yearsExperience) || 0,
                certifications: selectedCerts,
                available: true
              }])
              .select()
              .single();

            if (insertError) {
              if (insertError.code === '23505') {
                setError('Email already registered. Please log in.');
              } else {
                setError(insertError.message);
              }
              setLoading(false);
              return;
            }

            localStorage.setItem('lastcall_user', JSON.stringify(data));
            localStorage.setItem('lastcall_type', 'worker');
            setUser(data);
            setView('worker-dashboard');
          } else {
            const { data, error: selectError } = await supabase
              .from('workers')
              .select('*')
              .eq('email', email)
              .eq('password_hash', passwordHash)
              .single();

            if (selectError || !data) {
              setError('Invalid email or password');
              setLoading(false);
              return;
            }

            localStorage.setItem('lastcall_user', JSON.stringify(data));
            localStorage.setItem('lastcall_type', 'worker');
            setUser(data);
            setView('worker-dashboard');
          }
        } catch (err) {
          setError('Something went wrong. Please try again.');
        }
        setLoading(false);
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-brand-900 flex flex-col items-center justify-start p-6 overflow-y-auto">
          <button onClick={onBack} className="absolute top-4 left-4 text-slate-400 hover:text-white flex items-center gap-2">
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
            Back
          </button>

          <div className="w-full max-w-md mt-12">
            <div className="text-center mb-8 flex flex-col items-center">
              <Logo />
              <h2 className="text-2xl font-bold text-white mt-4">
                {mode === 'login' ? 'Worker Login' : 'Create Worker Profile'}
              </h2>
            </div>

            <form onSubmit={handleSubmit} className="bg-slate-800 rounded-2xl p-6 space-y-4">
              {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm">{error}</div>}

              <div>
                <label className="text-slate-300 text-sm">Email</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              {mode === 'signup' && (
                <>
                  <div>
                    <label className="text-slate-300 text-sm">Full Name</label>
                    <input
                      type="text"
                      value={fullName}
                      onChange={(e) => setFullName(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                      required
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">Phone</label>
                    <input
                      type="tel"
                      value={phone}
                      onChange={(e) => setPhone(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">Years of Experience</label>
                    <input
                      type="number"
                      value={yearsExperience}
                      onChange={(e) => setYearsExperience(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                      min="0"
                      max="50"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm mb-2 block">Positions (select all that apply)</label>
                    <div className="flex flex-wrap gap-2">
                      {POSITIONS.map(pos => (
                        <button
                          key={pos}
                          type="button"
                          onClick={() => toggleSelection(pos, selectedPositions, setSelectedPositions)}
                          className={`px-3 py-2 rounded-lg text-sm transition-all ${
                            selectedPositions.includes(pos)
                              ? 'bg-brand-500 text-white'
                              : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                          }`}
                        >
                          {pos}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm mb-2 block">POS Systems You Know</label>
                    <div className="flex flex-wrap gap-2">
                      {POS_SYSTEMS.map(pos => (
                        <button
                          key={pos}
                          type="button"
                          onClick={() => toggleSelection(pos, selectedPOS, setSelectedPOS)}
                          className={`px-3 py-2 rounded-lg text-sm transition-all ${
                            selectedPOS.includes(pos)
                              ? 'bg-green-500 text-white'
                              : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                          }`}
                        >
                          {pos}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm mb-2 block">Certifications</label>
                    <div className="flex flex-wrap gap-2">
                      {CERTIFICATIONS.map(cert => (
                        <button
                          key={cert}
                          type="button"
                          onClick={() => toggleSelection(cert, selectedCerts, setSelectedCerts)}
                          className={`px-3 py-2 rounded-lg text-sm transition-all ${
                            selectedCerts.includes(cert)
                              ? 'bg-blue-500 text-white'

    // Reset Password Component
    function ResetPassword({ userType, setView }) {
      const [email, setEmail] = useState('');
      const [code, setCode] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        if (newPassword !== confirmPassword) {
          setError('Passwords do not match');
          setLoading(false);
          return;
        }

        if (newPassword.length < 6) {
          setError('Password must be at least 6 characters');
          setLoading(false);
          return;
        }

        const table = userType === 'business' ? 'businesses' : 'workers';
        
        // Find user with matching email and code (case-insensitive)
        const { data: user } = await supabase
          .from(table)
          .select('id, reset_token, reset_token_expires')
          .ilike('email', email)
          .single();

        if (!user) {
          setError('No account found with that email');
          setLoading(false);
          return;
        }

        if (user.reset_token !== code) {
          setError('Invalid reset code');
          setLoading(false);
          return;
        }

        if (new Date(user.reset_token_expires) < new Date()) {
          setError('Reset code has expired. Please request a new one.');
          setLoading(false);
          return;
        }

        // Update password
        const passwordHash = await hashPassword(newPassword);
        await supabase
          .from(table)
          .update({ 
            password_hash: passwordHash, 
            reset_token: null, 
            reset_token_expires: null 
          })
          .eq('id', user.id);

        setSuccess(true);
        setLoading(false);
      };

      const backView = userType === 'business' ? 'business-auth' : 'worker-auth';

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-brand-900 flex flex-col items-center justify-center p-6">

                  Back to Login
                </button>
              </div>
            </div>
          </div>
        );

      return (

          <button onClick={() => setView(backView)} className="absolute top-4 left-4 text-slate-400 hover:text-white flex items-center gap-2">

              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
            Back
          </button>

          <div className="w-full max-w-md">
            <div className="text-center mb-8 flex flex-col items-center">
              <Logo />
              <h2 className="text-2xl font-bold text-white mt-4">Enter Reset Code</h2>
            </div>

            <form onSubmit={handleSubmit} className="bg-slate-800 rounded-2xl p-6 space-y-4">
              {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm">{error}</div>}

              <div>
                <label className="text-slate-300 text-sm">Email</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">Reset Code</label>
                <input
                  type="text"
                  value={code}
                  onChange={(e) => setCode(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none text-center text-xl tracking-widest"
                  placeholder="000000"

              <div>
                <label className="text-slate-300 text-sm">New Password</label>

    // Business Dashboard
    function BusinessDashboard({ user: initialUser, onLogout }) {
      const [user, setUser] = useState(initialUser);
      const [shifts, setShifts] = useState([]);
      const [pastShifts, setPastShifts] = useState([]);
      const [shiftTab, setShiftTab] = useState('upcoming');
      const [showPostShift, setShowPostShift] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [selectedShift, setSelectedShift] = useState(null);
      const [loading, setLoading] = useState(true);
      const [newInterestAlert, setNewInterestAlert] = useState(null);
      const knownInterestCountRef = React.useRef(-1); // -1 means not initialized yet

      // Request notification permission on mount
      useEffect(() => {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
      }, []);

      useEffect(() => {
        loadShifts();
        
        // Poll for new interests every 30 seconds
        const interval = setInterval(checkForNewInterests, 30000);
        return () => clearInterval(interval);
      }, []);

      const checkForNewInterests = async () => {
        // Get total interest count for all open shifts
        const { data: openShifts } = await supabase
          .from('shifts')
          .select('id')
          .eq('business_id', user.id)
          .eq('status', 'open');
        
        if (!openShifts || openShifts.length === 0) return;
        
        const shiftIds = openShifts.map(s => s.id);
        const { count } = await supabase
          .from('interests')
          .select('*', { count: 'exact', head: true })
          .in('shift_id', shiftIds);
        
        if (count > knownInterestCountRef.current && knownInterestCountRef.current >= 0) {
          // New interest!
          const newCount = count - knownInterestCountRef.current;
          setNewInterestAlert(`${newCount} new worker${newCount > 1 ? 's' : ''} interested!`);
          
          // Browser notification
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('LastCall', {
              body: `${newCount} new worker${newCount > 1 ? 's' : ''} expressed interest in your shift!`,
              icon: '📞'
            });
          }
          
          // Auto-dismiss after 5 seconds
          setTimeout(() => setNewInterestAlert(null), 5000);
        }
        knownInterestCountRef.current = count || 0;
      };

      const loadShifts = async () => {
        const now = new Date();
        const today = now.toISOString().split('T')[0];
        const currentTime = now.toTimeString().slice(0, 5); // "HH:MM"

        // Helper to check if shift has ended
        const shiftHasEnded = (shift) => {
          if (shift.shift_date < today) return true;
          if (shift.shift_date === today && shift.end_time <= currentTime) return true;
          return false;
        };

        // Load all shifts for this business
        const { data } = await supabase
          .from('shifts')
          .select('*')
          .eq('business_id', user.id)
          .order('shift_date', { ascending: true });
        
        const upcoming = (data || []).filter(shift => !shiftHasEnded(shift));
        const past = (data || []).filter(shift => shiftHasEnded(shift)).reverse();
        
        setShifts(upcoming);
        setPastShifts(past);

        // Initialize known interest count
        if (upcoming.length > 0) {
          const shiftIds = upcoming.filter(s => s.status === 'open').map(s => s.id);
          if (shiftIds.length > 0) {
            const { count } = await supabase
              .from('interests')
              .select('*', { count: 'exact', head: true })
              .in('shift_id', shiftIds);
            knownInterestCountRef.current = count || 0;
          }
        }

        setLoading(false);
      };

      const updateUser = (updatedUser) => {
        setUser(updatedUser);
        localStorage.setItem('lastcall_user', JSON.stringify(updatedUser));
      };

      if (showPostShift) {
        return <PostShiftForm user={user} onBack={() => setShowPostShift(false)} onSuccess={() => { setShowPostShift(false); loadShifts(); }} />;
      }

      if (showSettings) {
        return <BusinessSettings user={user} onBack={() => setShowSettings(false)} onSave={(updated) => { updateUser(updated); setShowSettings(false); }} />;
      }

      if (selectedShift) {
        return <ShiftInterests shift={selectedShift} business={user} onBack={() => { setSelectedShift(null); loadShifts(); }} />;
      }

      return (
        <div className="min-h-screen bg-slate-900">
          <header className="bg-slate-800 border-b border-slate-700 p-4">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <Logo size="small" />
                <div>
                  <h1 className="text-white font-semibold">{user.business_name}</h1>
                  <p className="text-slate-400 text-sm">{user.pos_system || 'No POS set'}</p>
                </div>
              </div>
              <div className="flex items-center gap-4">
                <button onClick={() => setShowSettings(true)} className="text-slate-400 hover:text-white">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </button>
                <button onClick={onLogout} className="text-slate-400 hover:text-white text-sm">Log out</button>
              </div>
            </div>
          </header>

          {/* New Interest Alert */}
          {newInterestAlert && (
            <div className="bg-green-500 text-white text-center py-3 px-4 font-semibold animate-pulse">
              🔔 {newInterestAlert}
              <button onClick={() => setNewInterestAlert(null)} className="ml-4 text-white/80 hover:text-white">✕</button>
            </div>
          )}

          <main className="max-w-4xl mx-auto p-4">
            <div className="flex items-center justify-between mb-6">
              <div className="flex items-center gap-4">
                <h2 className="text-xl font-bold text-white">Your Shifts</h2>
                <div className="flex gap-2">
                  <button
                    onClick={() => setShiftTab('upcoming')}
                    className={`px-3 py-1 rounded-lg text-sm transition-all ${
                      shiftTab === 'upcoming' ? 'bg-brand-500 text-white' : 'bg-slate-700 text-slate-300'
                    }`}
                  >
                    Upcoming ({shifts.length})
                  </button>
                  <button
                    onClick={() => setShiftTab('past')}
                    className={`px-3 py-1 rounded-lg text-sm transition-all ${
                      shiftTab === 'past' ? 'bg-slate-500 text-white' : 'bg-slate-700 text-slate-300'
                    }`}
                  >
                    Past ({pastShifts.length})
                  </button>
                </div>
              </div>
              <button
                onClick={() => setShowPostShift(true)}
                className="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-xl font-semibold flex items-center gap-2"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
                </svg>
                Post Shift
              </button>
            </div>

            {loading ? (
              <div className="text-slate-400 text-center py-12">Loading...</div>
            ) : shiftTab === 'upcoming' ? (
              shifts.length === 0 ? (
                <div className="bg-slate-800 rounded-2xl p-8 text-center">
                  <p className="text-slate-400 mb-4">No upcoming shifts</p>
                  <button
                    onClick={() => setShowPostShift(true)}
                    className="text-brand-400 hover:text-brand-300"
                  >
                    Post your first shift →
                  </button>
                </div>
              ) : (
                <div className="space-y-4">
                  {shifts.map(shift => (
                    <ShiftCard 
                      key={shift.id} 
                      shift={shift} 
                      onClick={() => setSelectedShift(shift)}
                      showStatus
                    />
                  ))}
                </div>
              )
            ) : (
              pastShifts.length === 0 ? (
                <div className="bg-slate-800 rounded-2xl p-8 text-center">
                  <p className="text-slate-400">No past shifts yet</p>
                </div>
              ) : (
                <div className="space-y-4">
                  {pastShifts.map(shift => (
                    <div key={shift.id} className="bg-slate-800/50 rounded-2xl p-4 opacity-75">
                      <div className="flex items-start justify-between">
                        <div>

                          </div>

          </main>
          <footer className="text-center py-6 text-slate-500 text-sm">
            Need help? Text <a href="sms:8084455890" className="text-brand-400 hover:text-brand-300">808-445-5890</a>

    // Post Shift Form
    function PostShiftForm({ user, onBack, onSuccess }) {
      const [position, setPosition] = useState('');
      const [shiftDate, setShiftDate] = useState('');
      const [startTime, setStartTime] = useState('');
      const [endTime, setEndTime] = useState('');
      const [hourlyRate, setHourlyRate] = useState('');
      const [tipsIncluded, setTipsIncluded] = useState(false);
      const [notes, setNotes] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const today = new Date().toISOString().split('T')[0];

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        // Validate date is not in the past
        const today = new Date().toISOString().split('T')[0];
        if (shiftDate < today) {
          setError('Shift date cannot be in the past');
          setLoading(false);
          return;
        }

        // Validate end time is after start time
        if (endTime <= startTime) {
          setError('End time must be after start time');
          setLoading(false);
          return;
        }

        const { error: insertError } = await supabase
          .from('shifts')
          .insert([{
            business_id: user.id,
            position,
            shift_date: shiftDate,
            start_time: startTime,
            end_time: endTime,
            hourly_rate: parseFloat(hourlyRate),
            tips_included: tipsIncluded,
            notes,
            status: 'open'
          }]);

        if (insertError) {
          setError(insertError.message);
          setLoading(false);
          return;
        }

        onSuccess();
      };

      return (
        <div className="min-h-screen bg-slate-900">
          <header className="bg-slate-800 border-b border-slate-700 p-4">
            <div className="max-w-4xl mx-auto flex items-center gap-4">

    // Business Settings Component
    function BusinessSettings({ user, onBack, onSave }) {
      const [businessName, setBusinessName] = useState(user.business_name || '');
      const [address, setAddress] = useState(user.address || '');
      const [phone, setPhone] = useState(user.phone || '');
      const [posSystem, setPosSystem] = useState(user.pos_system || '');
      const [menuNotes, setMenuNotes] = useState(user.menu_notes || '');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        setSuccess('');

        const { data, error: updateError } = await supabase
          .from('businesses')
          .update({
            business_name: businessName,
            address,
            phone,
            pos_system: posSystem,
            menu_notes: menuNotes
          })
          .eq('id', user.id)
          .select()
          .single();

        if (updateError) {
          setError(updateError.message);
          setLoading(false);
          return;
        }

        setSuccess('Settings saved!');
        setLoading(false);
        setTimeout(() => onSave(data), 1000);
      };

      return (
        <div className="min-h-screen bg-slate-900">
          <header className="bg-slate-800 border-b border-slate-700 p-4">
            <div className="max-w-4xl mx-auto flex items-center gap-4">

                </svg>

            </div>
          </header>

          <main className="max-w-lg mx-auto p-4">
            <form onSubmit={handleSubmit} className="bg-slate-800 rounded-2xl p-6 space-y-4">
              {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm">{error}</div>}
              {success && <div className="bg-green-500/20 text-green-300 p-3 rounded-lg text-sm">{success}</div>}

              <div>
                <label className="text-slate-300 text-sm">Business Name</label>
                <input
                  type="text"
                  value={businessName}
                  onChange={(e) => setBusinessName(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">Address</label>
                <input
                  type="text"
                  value={address}
                  onChange={(e) => setAddress(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  placeholder="123 Main St, City, State"
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">Phone</label>
                <input
                  type="tel"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">POS System</label>
                <select
                  value={posSystem}
                  onChange={(e) => setPosSystem(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                >
                  <option value="">Select POS System</option>
                  {POS_SYSTEMS.map(pos => <option key={pos} value={pos}>{pos}</option>)}
                </select>
              </div>

              <div>
                <label className="text-slate-300 text-sm">Menu Notes</label>
                <textarea
                  value={menuNotes}
                  onChange={(e) => setMenuNotes(e.target.value)}

              <button
