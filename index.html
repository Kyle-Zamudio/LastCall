    // Simple hash function for passwords (in production, use proper auth)
    const hashPassword = async (password) => {
      if (!password) {
        throw new Error('Password is required');
      }
      
      // Check if crypto.subtle is available (modern browsers)
      if (window.crypto && window.crypto.subtle) {
        try {
          const encoder = new TextEncoder();
          const data = encoder.encode(password);
          const hash = await crypto.subtle.digest('SHA-256', data);
          return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (err) {
          throw new Error('Password hashing failed. Please try again.');
        }
      } else {
        // Fallback for older browsers (basic hash, not secure but better than nothing)
        throw new Error('Your browser does not support secure password hashing. Please use a modern browser.');
      }
    };

    // Email validation helper
    const isValidEmail = (email) => {
      if (!email || !email.trim()) return false;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email.trim());
    };

    // Helper to format error messages for users
    const formatErrorMessage = (error) => {
      if (!error) return 'An unknown error occurred';
      
      // Network errors
      if (error.message && (
        error.message.includes('fetch') || 
        error.message.includes('network') || 
        error.message.includes('Failed to fetch') ||
        error.message.includes('NetworkError')
      )) {
        return 'Network error. Please check your internet connection and try again.';
      }
      
      // Supabase specific errors
      if (error.code) {
        switch (error.code) {
          case '23505':
            return 'This email is already registered. Please log in instead.';
          case '23502':
            return 'Missing required information. Please fill in all required fields.';
          case 'PGRST116':
            return 'No data found. Please try again.';
          case '42P01':
            return 'Database error. Please contact support.';
          default:
            return error.message || `Error: ${error.code}`;
        }
      }
      
      return error.message || error.toString() || 'An unexpected error occurred';
    };

    // Business Auth Component
    function BusinessAuth({ mode, setMode, setView, setUser, onBack }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [businessName, setBusinessName] = useState('');
      const [address, setAddress] = useState('');
      const [phone, setPhone] = useState('');
      const [posSystem, setPosSystem] = useState('');
      const [menuNotes, setMenuNotes] = useState('');
      const [menuUrl, setMenuUrl] = useState('');
      const [acceptedTerms, setAcceptedTerms] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        // Validate email format
        if (!isValidEmail(email)) {
          setError('Please enter a valid email address');
          setLoading(false);
          return;
        }

        // Validate password on signup
        if (mode === 'signup' && password.length < 6) {
          setError('Password must be at least 6 characters');
          setLoading(false);
          return;
        }

        // Validate terms acceptance on signup
        if (mode === 'signup' && !acceptedTerms) {
          setError('You must accept the Terms of Service to create an account');
          setLoading(false);
          return;
        }

        try {
          const passwordHash = await hashPassword(password);

          if (mode === 'signup') {
            // Validate required fields
            if (!businessName || !businessName.trim()) {
              setError('Business name is required');
              setLoading(false);
              return;
            }

            const { data, error: insertError } = await supabase
              .from('businesses')
              .insert([{
                email: email.trim().toLowerCase(),
                password_hash: passwordHash,
                business_name: businessName.trim(),
                address: address.trim() || null,
                phone: phone.trim() || null,
                pos_system: posSystem || null,
                menu_notes: menuNotes.trim() || null,
                menu_url: menuUrl.trim() || null
              }])
              .select()
              .single();

            if (insertError) {
              setError(formatErrorMessage(insertError));
              setLoading(false);
              return;
            }

            if (!data) {
              setError('Account created but failed to retrieve data. Please try logging in.');
              setLoading(false);
              return;
            }

            try {
              localStorage.setItem('lastcall_user', JSON.stringify(data));
              localStorage.setItem('lastcall_type', 'business');
            } catch (storageError) {
              setError('Account created but failed to save session. Please try logging in.');
              setLoading(false);
              return;
            }

            setUser(data);
            setView('business-dashboard');
          } else {
            // Use case-insensitive email lookup to match password reset behavior
            const { data, error: selectError } = await supabase
              .from('businesses')
              .select('*')
              .ilike('email', email.trim())
              .eq('password_hash', passwordHash)
              .single();

            if (selectError || !data) {
              setError('Invalid email or password');
              setLoading(false);
              return;
            }

            try {
              localStorage.setItem('lastcall_user', JSON.stringify(data));
              localStorage.setItem('lastcall_type', 'business');
            } catch (storageError) {
              setError('Login successful but failed to save session. Please try again.');
              setLoading(false);
              return;
            }

            setUser(data);
            setView('business-dashboard');
          }
        } catch (err) {
          setError(formatErrorMessage(err));
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-brand-900 flex flex-col items-center justify-center p-6">

            Back

          <div className="w-full max-w-md">
            <div className="text-center mb-8 flex flex-col items-center">

            <form onSubmit={handleSubmit} className="bg-slate-800 rounded-2xl p-6 space-y-4">
              {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm">{error}</div>}

              <div>
                <label className="text-slate-300 text-sm">Email</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              {mode === 'signup' && (
                <>
                  <div>
                    <label className="text-slate-300 text-sm">Business Name</label>
                    <input
                      type="text"
                      value={businessName}
                      onChange={(e) => setBusinessName(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                      required
                    />
                  </div>
                </>
              )}

              <div>
                <label className="text-slate-300 text-sm">Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              {mode === 'signup' && (
                <>
                  <div>
                    <label className="text-slate-300 text-sm">Phone</label>
                    <input
                      type="tel"
                      value={phone}
                      onChange={(e) => setPhone(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">Address</label>
                    <input
                      type="text"
                      value={address}
                      onChange={(e) => setAddress(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                      placeholder="123 Main St, City, State"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">POS System</label>
                    <select
                      value={posSystem}
                      onChange={(e) => setPosSystem(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    >
                      <option value="">Select POS System</option>
                      {POS_SYSTEMS.map(pos => <option key={pos} value={pos}>{pos}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">Menu URL (optional)</label>
                    <input
                      type="url"
                      value={menuUrl}
                      onChange={(e) => setMenuUrl(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                      placeholder="https://example.com/menu"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-sm">Menu Notes (optional)</label>
                    <textarea
                      value={menuNotes}
                      onChange={(e) => setMenuNotes(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                      rows={3}
                      placeholder="Describe your menu, signature items, etc."
                    />
                  </div>

                  <div className="bg-slate-700/50 rounded-xl p-4 border border-slate-600">
                    <label className="flex items-start gap-3 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={acceptedTerms}
                        onChange={(e) => setAcceptedTerms(e.target.checked)}
                        className="mt-1 w-5 h-5 rounded border-slate-600 bg-slate-700 text-brand-500 focus:ring-brand-500"
                        required
                      />
                      <div className="text-slate-300 text-sm">
                        <span className="font-semibold">I accept the Terms of Service</span>
                        <p className="text-slate-400 text-xs mt-1">
                          I understand that LastCall is a platform connecting businesses with workers. 
                          I am solely responsible for properly classifying workers (1099 contractor vs W-2 employee), 
                          tax reporting, and compliance with all employment laws. LastCall is not an employer 
                          and assumes no liability for employment or tax matters.
                        </p>
                      </div>
                    </label>
                  </div>
                </>
              )}

              <button
                type="submit"
                disabled={loading || (mode === 'signup' && !acceptedTerms)}
                className="w-full bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-semibold py-3 rounded-xl transition-all disabled:opacity-50"
              >
                {loading ? 'Please wait...' : (mode === 'login' ? 'Log In' : 'Create Account')}
              </button>

              <p className="text-center text-slate-400 text-sm">
                {mode === 'login' ? "Don't have an account? " : "Already have an account? "}
                <button
                  type="button"
                  onClick={() => setMode(mode === 'login' ? 'signup' : 'login')}
                  className="text-brand-400 hover:text-brand-300"
                >
                  {mode === 'login' ? 'Sign up' : 'Log in'}
                </button>
              </p>
              {mode === 'login' && (
                <p className="text-center">
                  <button
                    type="button"
                    onClick={() => setView('forgot-password-business')}
                    className="text-slate-500 hover:text-slate-400 text-sm"
                  >
                    Forgot password?
                  </button>
                </p>
              )}
            </form>
          </div>
        </div>
      );
    }

    // Worker Auth Component
    function WorkerAuth({ mode, setMode, setView, setUser, onBack }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [phone, setPhone] = useState('');
      const [selectedPOS, setSelectedPOS] = useState([]);
      const [selectedPositions, setSelectedPositions] = useState([]);
      const [yearsExperience, setYearsExperience] = useState('');
      const [selectedCerts, setSelectedCerts] = useState([]);
      const [acceptedTerms, setAcceptedTerms] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const toggleSelection = (item, selected, setSelected) => {
        if (selected.includes(item)) {
          setSelected(selected.filter(i => i !== item));
        } else {
          setSelected([...selected, item]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        // Validate email format
        if (!isValidEmail(email)) {
          setError('Please enter a valid email address');
          setLoading(false);
          return;
        }

        // Validate password on signup
        if (mode === 'signup' && password.length < 6) {
          setError('Password must be at least 6 characters');
          setLoading(false);
          return;
        }

        // Validate terms acceptance on signup
        if (mode === 'signup' && !acceptedTerms) {
          setError('You must accept the Terms of Service to create an account');
          setLoading(false);
          return;
        }

        // Validate required fields on signup
        if (mode === 'signup') {
          if (!fullName || !fullName.trim()) {
            setError('Full name is required');
            setLoading(false);
            return;
          }
          if (selectedPositions.length === 0) {
            setError('Please select at least one position');
            setLoading(false);
            return;
          }
          // Validate years experience if provided
          if (yearsExperience && (isNaN(parseInt(yearsExperience)) || parseInt(yearsExperience) < 0)) {
            setError('Years of experience must be a valid number (0 or greater)');
            setLoading(false);
            return;
          }
        }

        try {
          const passwordHash = await hashPassword(password);

          if (mode === 'signup') {
            const { data, error: insertError } = await supabase
              .from('workers')
              .insert([{
                email: email.trim().toLowerCase(),
                password_hash: passwordHash,
                full_name: fullName.trim(),
                phone: phone.trim() || null,
                pos_systems: selectedPOS.length > 0 ? selectedPOS : null,
                positions: selectedPositions,
                years_experience: parseInt(yearsExperience) || 0,
                certifications: selectedCerts.length > 0 ? selectedCerts : null,
                available: true
              }])
              .select()
              .single();

            if (insertError) {
              setError(formatErrorMessage(insertError));
              setLoading(false);
              return;
            }

      const [confirmPassword, setConfirmPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        if (newPassword !== confirmPassword) {
          setError('Passwords do not match');
          setLoading(false);
          return;
        }

        if (newPassword.length < 6) {
          setError('Password must be at least 6 characters');
          setLoading(false);
          return;
        }

        const table = userType === 'business' ? 'businesses' : 'workers';
        
        // Find user with matching email and code (case-insensitive)
        const { data: user } = await supabase
          .from(table)
          .select('id, reset_token, reset_token_expires')
          .ilike('email', email)
          .single();

        if (!user) {
          setError('No account found with that email');
          setLoading(false);
          return;
        }

        if (user.reset_token !== code) {
          setError('Invalid reset code');
          setLoading(false);
          return;
        }

        if (new Date(user.reset_token_expires) < new Date()) {
          setError('Reset code has expired. Please request a new one.');
          setLoading(false);
          return;
        }

        // Update password
        const passwordHash = await hashPassword(newPassword);
        await supabase
          .from(table)
          .update({ 
            password_hash: passwordHash, 
            reset_token: null, 
            reset_token_expires: null 
          })
          .eq('id', user.id);

        setLoading(false);

    // Business Dashboard
    function BusinessDashboard({ user: initialUser, onLogout }) {
      const [user, setUser] = useState(initialUser);
      const [shifts, setShifts] = useState([]);
      const [pastShifts, setPastShifts] = useState([]);
      const [shiftTab, setShiftTab] = useState('upcoming');
      const [showPostShift, setShowPostShift] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [selectedShift, setSelectedShift] = useState(null);
      const [loading, setLoading] = useState(true);
      const [newInterestAlert, setNewInterestAlert] = useState(null);
      const knownInterestCountRef = React.useRef(-1); // -1 means not initialized yet

      // Request notification permission on mount
      useEffect(() => {
        if ('Notification' in window) {
          if (Notification.permission === 'default') {
            Notification.requestPermission().then(permission => {
              if (permission === 'granted') {
              }
            });
          } else if (Notification.permission === 'denied') {
          }
        }
      }, []);

      const checkForNewInterests = React.useCallback(async () => {
        // Get open shifts with their details
        const { data: openShifts } = await supabase
          .from('shifts')
          .select('id, position, shift_date')
          .eq('business_id', user.id)
          .eq('status', 'open');
        
        if (!openShifts || openShifts.length === 0) {
          // No open shifts, hide alert
          setNewInterestAlert(null);
          knownInterestCountRef.current = 0;
          return;
        }
        
        const shiftIds = openShifts.map(s => s.id);
        const { data: interestsData, error } = await supabase
          .from('interests')
          .select('shift_id')
          .in('shift_id', shiftIds);
        
        if (error) {
          // Error checking interests - silently continue
          return;
        }
        
        const currentCount = interestsData?.length || 0;
        
        // Group interests by shift to show which positions have interest
        const interestsByShift = {};
        (interestsData || []).forEach(interest => {
          if (!interestsByShift[interest.shift_id]) {
            interestsByShift[interest.shift_id] = 0;
          }
          interestsByShift[interest.shift_id]++;
        });
        
        // Build alert message showing which shifts have interest
        if (currentCount > 0) {
          const shiftsWithInterest = openShifts.filter(s => interestsByShift[s.id] > 0);
          
          if (shiftsWithInterest.length === 1) {
            // Single shift with interest - show position
            const shift = shiftsWithInterest[0];
            const count = interestsByShift[shift.id];
            setNewInterestAlert(`${count} worker${count > 1 ? 's' : ''} interested in ${shift.position} position`);
          } else {
            // Multiple shifts with interest - show summary
            const totalShifts = shiftsWithInterest.length;
            const positions = [...new Set(shiftsWithInterest.map(s => s.position))];
            
            if (positions.length === 1) {
              // Same position, different dates
              setNewInterestAlert(`${currentCount} worker${currentCount > 1 ? 's' : ''} interested across ${totalShifts} ${positions[0]} shift${totalShifts > 1 ? 's' : ''}`);
            } else {
              // Different positions
              const positionList = positions.length <= 2 
                ? positions.join(' and ')
                : `${positions.slice(0, 2).join(', ')}, and ${positions.length - 2} more`;
              setNewInterestAlert(`${currentCount} worker${currentCount > 1 ? 's' : ''} interested (${positionList})`);
            }
          }
        } else {
          setNewInterestAlert(null);
        }
        
        // Send browser notification only when count increases (new interest)
        if (currentCount > knownInterestCountRef.current && knownInterestCountRef.current >= 0) {
          const newCount = currentCount - knownInterestCountRef.current;
          
          // Find which shift got the new interest
          const newInterests = (interestsData || []).slice(-newCount);
          const newShiftIds = [...new Set(newInterests.map(i => i.shift_id))];
          const newShifts = openShifts.filter(s => newShiftIds.includes(s.id));
          const positionText = newShifts.length === 1 
            ? ` for ${newShifts[0].position} position`
            : newShifts.length > 0 
              ? ` across ${newShifts.length} shift${newShifts.length > 1 ? 's' : ''}`
              : '';
          
          // Browser notification for new interest
          if ('Notification' in window && Notification.permission === 'granted') {
            try {
              new Notification('LastCall', {
                body: `${newCount} new worker${newCount > 1 ? 's' : ''} expressed interest${positionText}! Total: ${currentCount}`,
                icon: '📞',
                badge: '📞',
                tag: 'new-interest'
              });
            } catch (err) {
              // Notification error - silently continue
            }
          }
          
          // Reload shifts to show new interests
          loadShifts();
        } else if (currentCount > 0) {
          // Just update the count display, no notification needed
          loadShifts();
        }
        
        knownInterestCountRef.current = currentCount;
      }, [user.id]);

      useEffect(() => {
        loadShifts();
        
        // Poll for new interests every 15 seconds for faster notifications
        const interval = setInterval(() => {
          checkForNewInterests();
        }, 15000);
        
        return () => clearInterval(interval);
      }, [checkForNewInterests]);

      const loadShifts = async () => {
        setLoading(true);
        try {
          const now = new Date();
          const today = now.toISOString().split('T')[0];
          const currentTime = now.toTimeString().slice(0, 5); // "HH:MM"

          // Helper to check if shift has ended
          const shiftHasEnded = (shift) => {
            if (shift.shift_date < today) return true;
            if (shift.shift_date === today && shift.end_time <= currentTime) return true;
            return false;
          };

          // Load all shifts for this business
          const { data, error } = await supabase
            .from('shifts')
            .select('*')
            .eq('business_id', user.id)
            .order('shift_date', { ascending: true });
          
          if (error) {
            // Continue with empty arrays if error
            setShifts([]);
            setPastShifts([]);
            setLoading(false);
            return;
          }
          
          const upcoming = (data || []).filter(shift => !shiftHasEnded(shift));
          const past = (data || []).filter(shift => shiftHasEnded(shift)).reverse();
          
          setShifts(upcoming);
          setPastShifts(past);

          // Initialize known interest count and set alert if there are interests
          if (upcoming.length > 0) {
            const openShifts = upcoming.filter(s => s.status === 'open');
            const shiftIds = openShifts.map(s => s.id);
            if (shiftIds.length > 0) {
              const { data: interestsData, error } = await supabase
                .from('interests')
                .select('shift_id')
                .in('shift_id', shiftIds);
              if (!error) {
                const interestCount = interestsData?.length || 0;
                knownInterestCountRef.current = interestCount;
                
                // Build alert message showing which shifts have interest
                if (interestCount > 0) {
                  const interestsByShift = {};
                  (interestsData || []).forEach(interest => {
                    if (!interestsByShift[interest.shift_id]) {
                      interestsByShift[interest.shift_id] = 0;
                    }
                    interestsByShift[interest.shift_id]++;
                  });
                  
                  const shiftsWithInterest = openShifts.filter(s => interestsByShift[s.id] > 0);
                  
                  if (shiftsWithInterest.length === 1) {
                    // Single shift with interest - show position
                    const shift = shiftsWithInterest[0];
                    const count = interestsByShift[shift.id];
                    setNewInterestAlert(`${count} worker${count > 1 ? 's' : ''} interested in ${shift.position} position`);
                  } else {
                    // Multiple shifts with interest - show summary
                    const totalShifts = shiftsWithInterest.length;
                    const positions = [...new Set(shiftsWithInterest.map(s => s.position))];
                    
                    if (positions.length === 1) {
                      // Same position, different dates
                      setNewInterestAlert(`${interestCount} worker${interestCount > 1 ? 's' : ''} interested across ${totalShifts} ${positions[0]} shift${totalShifts > 1 ? 's' : ''}`);
                    } else {
                      // Different positions
                      const positionList = positions.length <= 2 
                        ? positions.join(' and ')
                        : `${positions.slice(0, 2).join(', ')}, and ${positions.length - 2} more`;
                      setNewInterestAlert(`${interestCount} worker${interestCount > 1 ? 's' : ''} interested (${positionList})`);
                    }
                  }
                } else {
                  setNewInterestAlert(null);
                }
              } else {
                knownInterestCountRef.current = 0;
                setNewInterestAlert(null);
              }
            } else {
              knownInterestCountRef.current = 0;
              setNewInterestAlert(null);
            }
          } else {
            knownInterestCountRef.current = 0;
            setNewInterestAlert(null);
          }
        } catch (err) {
          // Silently handle errors - don't crash the app
          setShifts([]);
          setPastShifts([]);
          knownInterestCountRef.current = 0;
          setNewInterestAlert(null);
        } finally {
          setLoading(false);
        }
      };

      const updateUser = (updatedUser) => {
        setUser(updatedUser);
        localStorage.setItem('lastcall_user', JSON.stringify(updatedUser));
      };

      if (showPostShift) {
        return <PostShiftForm user={user} onBack={() => setShowPostShift(false)} onSuccess={() => { setShowPostShift(false); loadShifts(); }} />;
      }

      if (showSettings) {
        return <BusinessSettings user={user} onBack={() => setShowSettings(false)} onSave={(updated) => { updateUser(updated); setShowSettings(false); }} />;
      }

      if (selectedShift) {
        return <ShiftInterests shift={selectedShift} business={user} onBack={() => { setSelectedShift(null); loadShifts(); }} />;
      }

      return (

              <div className="flex items-center gap-4">

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </button>
                <button onClick={onLogout} className="text-slate-400 hover:text-white text-sm">Log out</button>
              </div>
            </div>
          </header>

          {/* New Interest Alert */}
          {newInterestAlert && (

          )}

          <main className="max-w-4xl mx-auto p-4">

    // Post Shift Form
    function PostShiftForm({ user, onBack, onSuccess }) {
      const [position, setPosition] = useState('');
      const [shiftDate, setShiftDate] = useState('');
      const [startTime, setStartTime] = useState('');
      const [endTime, setEndTime] = useState('');
      const [hourlyRate, setHourlyRate] = useState('');
      const [tipsIncluded, setTipsIncluded] = useState(false);
      const [notes, setNotes] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const today = new Date().toISOString().split('T')[0];

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        // Validate date is not in the past
        const today = new Date().toISOString().split('T')[0];
        if (shiftDate < today) {
          setError('Shift date cannot be in the past');
          setLoading(false);
          return;
        }

        // Validate same-day shifts haven't already started
        if (shiftDate === today) {
          const now = new Date();
          const currentTime = now.toTimeString().slice(0, 5); // "HH:MM"
          if (startTime <= currentTime) {
            setError('Cannot post a shift that has already started today');
            setLoading(false);
            return;
          }
        }

        // Validate end time is after start time
        if (endTime <= startTime) {
          setError('End time must be after start time');
          setLoading(false);
          return;
        }

        // Validate hourly rate
        const rate = parseFloat(hourlyRate);
        if (isNaN(rate) || rate < 0) {
          setError('Please enter a valid hourly rate');
          setLoading(false);
          return;
        }

        if (!tipsIncluded && rate < 7.25) {
          setError('Hourly rate must be at least minimum wage ($7.25/hr) unless tips are included');
          setLoading(false);
          return;
        }

        try {
          const { error: insertError } = await supabase
            .from('shifts')
            .insert([{
              business_id: user.id,
              position,
              shift_date: shiftDate,
              start_time: startTime,
              end_time: endTime,
              hourly_rate: rate,
              tips_included: tipsIncluded,
              notes,
              status: 'open'
            }]);

          if (insertError) {
            setError(formatErrorMessage(insertError));
            setLoading(false);
            return;
          }

          onSuccess();
        } catch (err) {
          setError(formatErrorMessage(err));
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-900">
          <header className="bg-slate-800 border-b border-slate-700 p-4">
            <div className="max-w-4xl mx-auto flex items-center gap-4">

                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                </svg>
              </button>
              <h1 className="text-xl font-bold text-white">Post a Shift</h1>
            </div>
          </header>

          <main className="max-w-lg mx-auto p-4">
            <form onSubmit={handleSubmit} className="bg-slate-800 rounded-2xl p-6 space-y-4">
              {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm">{error}</div>}

              <div>
                <label className="text-slate-300 text-sm">Position</label>
                <select
                  value={position}
                  onChange={(e) => setPosition(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                >
                  <option value="">Select position</option>
                  {POSITIONS.map(pos => <option key={pos} value={pos}>{pos}</option>)}
                </select>
              </div>

              <div>
                <label className="text-slate-300 text-sm">Date</label>
                <input
                  type="date"
                  value={shiftDate}
                  onChange={(e) => setShiftDate(e.target.value)}
                  min={today}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-slate-300 text-sm">Start Time</label>
                  <input
                    type="time"
                    value={startTime}
                    onChange={(e) => setStartTime(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    required
                  />
                </div>
                <div>
                  <label className="text-slate-300 text-sm">End Time</label>
                  <input
                    type="time"
                    value={endTime}

                    required
                  />
                </div>
              </div>

              <div>
                <label className="text-slate-300 text-sm">Hourly Rate ($)</label>
                <input
                  type="number"
                  value={hourlyRate}
                  onChange={(e) => setHourlyRate(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  min="0"
                  step="0.01"
                  placeholder={tipsIncluded ? "2.13 (tipped minimum)" : "25.00"}
                  required
                />
                {!tipsIncluded && parseFloat(hourlyRate) < 7.25 && hourlyRate && (
                  <p className="text-yellow-400 text-xs mt-1">⚠ Minimum wage is $7.25/hr</p>
                )}
              </div>

              <div className="flex items-center justify-between bg-slate-700 p-4 rounded-xl">
                <div>
                  <p className="text-white font-medium">Tips included?</p>
                  <p className="text-slate-400 text-sm">{tipsIncluded ? "Worker keeps tips (lower base rate)" : "Flat hourly rate, no tips"}</p>

                <button

                </button>
              </div>

              <div>
                <label className="text-slate-300 text-sm">Notes (optional)</label>
                <textarea
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}

                  rows={3}

              <button

                disabled={loading}

              >
                {loading ? 'Posting...' : 'Post Shift'}
              </button>
            </form>
          </main>
        </div>
      );
    }

      const [saving, setSaving] = useState(false);
      const [editError, setEditError] = useState('');
      const today = new Date().toISOString().split('T')[0];
      
      // Payment form state
      const getPaymentInfo = () => {

          return {
            method: shift.payment_method || '',
            amount: shift.amount_paid || '',

      const paymentInfo = getPaymentInfo();
