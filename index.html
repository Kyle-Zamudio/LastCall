      const [paymentError, setPaymentError] = useState('');
      const [workerInfo, setWorkerInfo] = useState(null);
      const isUnfillingRef = React.useRef(false);

      useEffect(() => {
        // Don't load if we're in the middle of unfilling
        if (!isUnfillingRef.current) {
          loadInterests();
          // Load worker info if shift is filled
          if (shift.filled_by) {
            loadWorkerInfo();
          }
        }
      }, [shift.id]);
      
      const loadWorkerInfo = async () => {
        try {
          const { data, error } = await supabase
            .from('workers')
            .select('preferred_payment_methods')
            .eq('id', shift.filled_by)
            .single();
          
          if (error) {
            // Column might not exist yet, that's okay - just log and continue
            // Could not load worker payment preferences - silently continue
            return;
          }
          
          if (data) {
            setWorkerInfo(data);
            // Pre-fill payment method if not already set and worker has a preferred method
            if (!paymentInfo.method && data.preferred_payment_methods?.length > 0) {
              setPaymentMethod(data.preferred_payment_methods[0]);
            }
          }
        } catch (err) {
          // Silently handle errors - column might not exist yet
        }
      };

      const loadInterests = async () => {
        try {
          const { data, error } = await supabase
            .from('interests')
            .select(`
              *,
              worker:workers(*)
            `)
            .eq('shift_id', shift.id);
          
          if (error) {
            setLoading(false);
            return;
          }
          
          // Sort by POS match
          const sorted = (data || []).sort((a, b) => {
            const aMatch = a.worker?.pos_systems?.includes(business.pos_system) ? 1 : 0;
            const bMatch = b.worker?.pos_systems?.includes(business.pos_system) ? 1 : 0;
            return bMatch - aMatch;
          });
          
          setInterests(sorted);
        } catch (err) {
          // Error in loadInterests - silently continue
        } finally {
          setLoading(false);
        }
      };

      // Check if shift has ended
      const shiftHasEnded = () => {
        if (!shift || !shift.shift_date || !shift.end_time) return false;
        const now = new Date();
        const today = now.toISOString().split('T')[0];
        const currentTime = now.toTimeString().slice(0, 5);
        if (shift.shift_date < today) return true;
        if (shift.shift_date === today && shift.end_time <= currentTime) return true;
        return false;
      };

      const markCompleted = async () => {
        setPaymentSaving(true);
        setPaymentError('');
        
        const updateData = {
          completed: true
        };
        
        if (paymentMethod) updateData.payment_method = paymentMethod;
        if (amountPaid) updateData.amount_paid = parseFloat(amountPaid);
        if (tipsPaid) updateData.tips_paid = parseFloat(tipsPaid);
        if (paymentNotes) updateData.payment_notes = paymentNotes;

        const { error: updateError } = await supabase
          .from('shifts')
          .update(updateData)
          .eq('id', shift.id);

        if (updateError) {
          if (updateError.message.includes('column') && updateError.message.includes('does not exist')) {
            const paymentInfoText = `PAYMENT: Method=${paymentMethod || 'N/A'}, Amount=$${amountPaid || '0'}, Tips=$${tipsPaid || '0'}, Notes=${paymentNotes || 'None'}`;
            const existingNotes = shift.notes || '';
            const combinedNotes = existingNotes ? `${existingNotes}\n\n${paymentInfoText}` : paymentInfoText;
            
            const { error: fallbackError } = await supabase
              .from('shifts')
              .update({ 
                completed: true,
                notes: combinedNotes 
              })
              .eq('id', shift.id);
            
            if (fallbackError) {
              setPaymentError('Failed to save payment info. Please run the database migration.');
              setPaymentSaving(false);
              return;
            }
          } else {
            setPaymentError(updateError.message);
            setPaymentSaving(false);
            return;
          }
        }

        setIsCompleted(true);
        setShowPaymentForm(false);
        setPaymentSaving(false);
        // Reload shift data
        const { data: updatedShift } = await supabase
          .from('shifts')
          .select('*')
          .eq('id', shift.id)
          .single();
        if (updatedShift) setShift(updatedShift);
      };

      const acceptWorker = async (interest) => {
        setLoading(true);
        
        try {
          // First, check if shift is still open (prevent race condition)
          const { data: currentShift, error: checkError } = await supabase
            .from('shifts')
            .select('status, filled_by')
            .eq('id', shift.id)
            .single();

          if (checkError) {
            setError(formatErrorMessage(checkError));
            setLoading(false);
            return;
          }

          if (currentShift.status !== 'open' || currentShift.filled_by) {
            setError('This shift has already been filled by another worker.');
            setLoading(false);
            // Reload to show updated status
            loadInterests();
            return;
          }

          // Update shift status atomically
          const { error: shiftError } = await supabase
            .from('shifts')
            .update({ status: 'filled', filled_by: interest.worker_id })
            .eq('id', shift.id)
            .eq('status', 'open'); // Only update if still open

          if (shiftError) {
            setError(formatErrorMessage(shiftError));
            setLoading(false);
            return;
          }

          // Update accepted interest
          const { error: acceptError } = await supabase
            .from('interests')
            .update({ status: 'accepted' })
            .eq('id', interest.id);

          if (acceptError) {
            // Rollback shift update if interest update fails
            await supabase
              .from('shifts')
              .update({ status: 'open', filled_by: null })
              .eq('id', shift.id);
            setError(formatErrorMessage(acceptError));
            setLoading(false);
            return;
          }

          // Reject others
          const { error: rejectError } = await supabase
            .from('interests')
            .update({ status: 'rejected' })
            .eq('shift_id', shift.id)
            .neq('id', interest.id);

          if (rejectError) {
            // Log but don't fail - main operation succeeded
            // Could add a warning message if needed
          }

          onBack();
        } catch (err) {
          setError(formatErrorMessage(err));
          setLoading(false);
        }
      };

      const unfillShift = async () => {
        if (!confirm('Are you sure you want to release this worker? The shift will be reopened and they will be notified.')) {
          return;
        }

        isUnfillingRef.current = true;
        setLoading(true);
        setError('');

        try {
          // Get the worker ID who was accepted
          const workerId = shift.filled_by;

          // Update shift back to open
          const { error: shiftError } = await supabase
            .from('shifts')
            .update({ status: 'open', filled_by: null })
            .eq('id', shift.id);

          if (shiftError) {
            setError(formatErrorMessage(shiftError));
            setLoading(false);
            isUnfillingRef.current = false;
            return;
          }

          // Delete the accepted interest so the worker can express interest again if they want
          await supabase
            .from('interests')
            .delete()
            .eq('shift_id', shift.id)
            .eq('worker_id', workerId)
            .eq('status', 'accepted');

          // Reload shift data
          const { data: updatedShift } = await supabase
            .from('shifts')
            .select('*')
            .eq('id', shift.id)
            .single();

          if (updatedShift) {
            setShift(updatedShift);
          }

          // Reload interests directly (without calling loadInterests to avoid loading state conflicts)
          const { data: interestsData, error: interestsError } = await supabase
            .from('interests')
            .select(`
              *,
              worker:workers(*)
            `)
            .eq('shift_id', shift.id);
          
          if (!interestsError && interestsData) {
            // Sort by POS match
            const sorted = interestsData.sort((a, b) => {
              const aMatch = a.worker?.pos_systems?.includes(business.pos_system) ? 1 : 0;
              const bMatch = b.worker?.pos_systems?.includes(business.pos_system) ? 1 : 0;
              return bMatch - aMatch;
            });
            setInterests(sorted);
          }
        } catch (err) {
          setError(formatErrorMessage(err));
        } finally {
          // Always clear loading state
          setLoading(false);
          // Reset the ref after a short delay to allow state updates to complete
          setTimeout(() => {
            isUnfillingRef.current = false;
          }, 100);
        }
      };

      const saveEdit = async () => {
        setSaving(true);
        setEditError('');

        // Validate date is not in the past
        const today = new Date().toISOString().split('T')[0];
        if (shiftDate < today) {
          setEditError('Shift date cannot be in the past');
          setSaving(false);
          return;
        }

        // Validate same-day shifts haven't already started
        if (shiftDate === today) {
          const now = new Date();
          const currentTime = now.toTimeString().slice(0, 5);
          if (startTime <= currentTime) {
            setEditError('Cannot edit a shift that has already started today');
            setSaving(false);
            return;
          }
        }

        // Validate end time is after start time
        if (endTime <= startTime) {
          setEditError('End time must be after start time');
          setSaving(false);
          return;
        }

        // Validate hourly rate
        const rate = parseFloat(hourlyRate);
        if (isNaN(rate) || rate < 0) {
          setEditError('Please enter a valid hourly rate');
          setSaving(false);
          return;
        }

        if (!tipsIncluded && rate < 7.25) {
          setEditError('Hourly rate must be at least minimum wage ($7.25/hr) unless tips are included');
          setSaving(false);
          return;
        }

        try {
          const { data, error } = await supabase
            .from('shifts')
            .update({
              position,
              shift_date: shiftDate,
              start_time: startTime,
              end_time: endTime,
              hourly_rate: rate,
              tips_included: tipsIncluded,
              notes
            })
            .eq('id', shift.id)
            .select()
            .single();
          
          if (error) {
            setEditError(error.message || 'Failed to update shift. Please try again.');
            setSaving(false);
            return;
          }

          if (data) {
            setShift(data);
            setIsEditing(false);
          }
        } catch (err) {
          setEditError('An unexpected error occurred. Please try again.');
        }
        setSaving(false);
      };

      const deleteShift = async () => {
        // Delete all interests first
        const { error: interestError } = await supabase
          .from('interests')
          .delete()
          .eq('shift_id', shift.id);
        
        if (interestError) {
          // Error deleting interests - silently continue
        }
        
        // Delete the shift
        const { error: shiftError } = await supabase
          .from('shifts')
          .delete()
          .eq('id', shift.id);
        
        if (shiftError) {
          // Error will be handled by the component's error state
          return;
        }
        
        onBack();
      };

      const formatDate = (date) => new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const formatTime = (time) => {
        const [h, m] = time.split(':');
        const hour = parseInt(h);
        const ampm = hour >= 12 ? 'PM' : 'AM';
        const hour12 = hour % 12 || 12;
        return `${hour12}:${m} ${ampm}`;
      };

      // Delete confirmation modal
      if (showDeleteConfirm) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-slate-800 rounded-2xl p-6 max-w-md w-full">
              <h2 className="text-xl font-bold text-white mb-4">Delete Shift?</h2>
              <p className="text-slate-400 mb-6">
                Are you sure you want to delete this {shift.position} shift? 
                {interests.length > 0 && ` ${interests.length} worker(s) have expressed interest.`}
                This cannot be undone.
              </p>
              <div className="flex gap-4">
                <button
                  onClick={() => setShowDeleteConfirm(false)}
                  className="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-semibold"
                >
                  Cancel
                </button>
                <button
                  onClick={deleteShift}
                  className="flex-1 bg-red-500 hover:bg-red-600 text-white py-3 rounded-xl font-semibold"
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Payment form mode
      if (showPaymentForm) {
        return (
          <div className="min-h-screen bg-slate-900">
            <header className="bg-slate-800 border-b border-slate-700 p-4">
              <div className="max-w-4xl mx-auto flex items-center gap-4">
                <button onClick={() => setShowPaymentForm(false)} className="text-slate-400 hover:text-white">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <h1 className="text-xl font-bold text-white">Mark as Completed & Add Payment</h1>
              </div>
            </header>

            <main className="max-w-lg mx-auto p-4">
              <div className="bg-slate-800 rounded-2xl p-6 space-y-4">
                {paymentError && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm">{paymentError}</div>}

                <div>
                  <label className="text-slate-300 text-sm">Payment Method</label>
                  {workerInfo?.preferred_payment_methods?.length > 0 && !paymentInfo.method && (
                    <p className="text-slate-400 text-xs mt-1 mb-2">
                      💡 Worker prefers: {workerInfo.preferred_payment_methods.join(', ')}
                    </p>
                  )}
                  <select
                    value={paymentMethod}
                    onChange={(e) => setPaymentMethod(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  >
                    <option value="">Select payment method</option>
                    {workerInfo?.preferred_payment_methods?.length > 0 && (
                      <optgroup label="Worker's Preferred">
                        {workerInfo.preferred_payment_methods.map(method => (
                          <option key={method} value={method}>{method} (Preferred)</option>
                        ))}
                      </optgroup>
                    )}
                    <optgroup label="All Methods">
                      <option value="Cash">Cash</option>
                      <option value="Venmo">Venmo</option>
                      <option value="PayPal">PayPal</option>
                      <option value="Zelle">Zelle</option>
                      <option value="Cash App">Cash App</option>
                      <option value="Check">Check</option>
                      <option value="Other">Other</option>
                    </optgroup>
                  </select>
                </div>

                <div>
                  <label className="text-slate-300 text-sm">Amount Paid - Hourly ($)</label>
                  <input
                    type="number"
                    value={amountPaid}
                    onChange={(e) => setAmountPaid(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                  />
                </div>

                <div>
                  <label className="text-slate-300 text-sm">Tips Paid ($)</label>
                  <p className="text-slate-400 text-xs mt-1 mb-2">Separate from hourly pay for tax purposes</p>
                  <input
                    type="number"
                    value={tipsPaid}
                    onChange={(e) => setTipsPaid(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                  />
                </div>

                <div>
                  <label className="text-slate-300 text-sm">Payment Notes (optional)</label>
                  <textarea
                    value={paymentNotes}
                    onChange={(e) => setPaymentNotes(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    rows={2}
                    placeholder="Any additional payment details..."
                  />
                </div>

                <button
                  onClick={markCompleted}
                  disabled={paymentSaving}
                  className="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition-all disabled:opacity-50"
                >
                  {paymentSaving ? 'Saving...' : 'Mark as Completed'}
                </button>
              </div>
            </main>
          </div>
        );
      }

      // Edit mode
      if (isEditing) {
        return (
          <div className="min-h-screen bg-slate-900">
            <header className="bg-slate-800 border-b border-slate-700 p-4">
              <div className="max-w-4xl mx-auto flex items-center gap-4">
                <button onClick={() => setIsEditing(false)} className="text-slate-400 hover:text-white">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <h1 className="text-xl font-bold text-white">Edit Shift</h1>
              </div>
            </header>

            <main className="max-w-lg mx-auto p-4">
              <div className="bg-slate-800 rounded-2xl p-6 space-y-4">
                {editError && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm">{editError}</div>}
                <div>
                  <label className="text-slate-300 text-sm">Position</label>
                  <select
                    value={position}
                    onChange={(e) => setPosition(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  >
                    {POSITIONS.map(pos => <option key={pos} value={pos}>{pos}</option>)}
                  </select>
                </div>

                <div>
                  <label className="text-slate-300 text-sm">Date</label>
                  <input
                    type="date"
                    value={shiftDate}
                    onChange={(e) => setShiftDate(e.target.value)}
                    min={today}
                    className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-slate-300 text-sm">Start Time</label>
                    <input
                      type="time"
                      value={startTime}
                      onChange={(e) => setStartTime(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-slate-300 text-sm">End Time</label>
                    <input
                      type="time"
                      value={endTime}
                      onChange={(e) => setEndTime(e.target.value)}
                      className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-slate-300 text-sm">Hourly Rate ($)</label>
                  <input
                    type="number"
                    value={hourlyRate}
                    onChange={(e) => setHourlyRate(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    min="0"
                    step="0.50"
                  />
                </div>

                <div className="flex items-center justify-between bg-slate-700 p-4 rounded-xl">
                  <div>
                    <p className="text-white font-medium">Tips included?</p>
                    <p className="text-slate-400 text-sm">{tipsIncluded ? "Worker keeps tips" : "Flat rate, no tips"}</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setTipsIncluded(!tipsIncluded)}
                    className={`w-14 h-8 rounded-full transition-all ${tipsIncluded ? 'bg-green-500' : 'bg-slate-600'}`}
                  >
                    <div className={`w-6 h-6 bg-white rounded-full shadow transition-all ${tipsIncluded ? 'ml-7' : 'ml-1'}`} />
                  </button>
                </div>

                <div>
                  <label className="text-slate-300 text-sm">Notes (optional)</label>
                  <textarea
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                    rows={3}
                  />
                </div>

                <button
                  onClick={saveEdit}
                  disabled={saving}
                  className="w-full bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-semibold py-3 rounded-xl transition-all disabled:opacity-50"
                >
                  {saving ? 'Saving...' : 'Save Changes'}
                </button>
              </div>
            </main>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900">
          <header className="bg-slate-800 border-b border-slate-700 p-4">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-4">
                <button onClick={onBack} className="text-slate-400 hover:text-white">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <div>
                  <h1 className="text-xl font-bold text-white">{shift.position}</h1>
                  <p className="text-slate-400 text-sm">{formatDate(shift.shift_date)} • {formatTime(shift.start_time)} - {formatTime(shift.end_time)} • ${shift.hourly_rate}/hr{shift.tips_included && ' + tips'}</p>
                </div>
              </div>
              {shift.status === 'open' && (
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setIsEditing(true)}
                    className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-semibold flex items-center gap-2"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                    Edit
                  </button>
                  <button
                    onClick={() => setShowDeleteConfirm(true)}
                    className="bg-red-500/20 hover:bg-red-500/30 text-red-400 px-4 py-2 rounded-xl font-semibold flex items-center gap-2"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    Delete
                  </button>
                </div>
              )}
              {shift.status === 'filled' && shiftHasEnded() && !isCompleted && (
                <button
                  onClick={() => setShowPaymentForm(true)}
                  className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-xl font-semibold flex items-center gap-2"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  Mark Paid
                </button>
              )}
              {isCompleted && (paymentMethod || amountPaid || tipsPaid || paymentNotes) && (
                <div className="bg-green-500/20 text-green-400 px-4 py-2 rounded-xl text-sm font-semibold">
                  ✓ Payment Recorded
                </div>
              )}
            </div>
          </header>

          <main className="max-w-4xl mx-auto p-4">
            {isCompleted && (paymentMethod || amountPaid || tipsPaid || paymentNotes) && (
              <div className="bg-green-500/10 border border-green-500/30 rounded-2xl p-4 mb-4">
                <h3 className="text-green-400 font-semibold mb-2">✓ Payment Recorded</h3>
                {paymentMethod && (
                  <p className="text-slate-300 text-sm">💳 Payment Method: {paymentMethod}</p>
                )}
                {amountPaid && (
                  <p className="text-slate-300 text-sm">💰 Hourly Pay: ${parseFloat(amountPaid).toFixed(2)}</p>
                )}
                {tipsPaid && (
                  <p className="text-slate-300 text-sm">💵 Tips: ${parseFloat(tipsPaid).toFixed(2)}</p>
                )}
                {paymentNotes && (
                  <p className="text-slate-400 text-xs mt-1">📝 {paymentNotes}</p>
                )}
              </div>
            )}
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-semibold text-white">
                {shift.status === 'filled' ? 'Shift Filled' : `Interested Workers (${interests.length})`}
              </h2>
              {shift.status === 'filled' && !shiftHasEnded() && (
                <button
                  onClick={unfillShift}
                  disabled={loading}
                  className="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-xl font-semibold text-sm flex items-center gap-2 disabled:opacity-50"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                  </svg>
                  Release Worker
                </button>
              )}
            </div>

            {loading ? (
              <div className="text-slate-400 text-center py-12">Loading...</div>
            ) : interests.length === 0 ? (
              <div className="bg-slate-800 rounded-2xl p-8 text-center">
                <p className="text-slate-400">No workers have expressed interest yet</p>
                <p className="text-slate-500 text-sm mt-2">Check back soon!</p>
              </div>
            ) : (
              <div className="space-y-4">
                {interests.map(interest => {
                  const worker = interest.worker;
                  const posMatch = worker?.pos_systems?.includes(business.pos_system);
                  
                  return (
                    <div key={interest.id} className={`bg-slate-800 rounded-2xl p-4 ${interest.status === 'accepted' ? 'ring-2 ring-green-500' : ''}`}>
                      <div className="flex items-start justify-between">
                        <div className="flex items-center gap-4">
                          <div className="w-12 h-12 bg-slate-700 rounded-full flex items-center justify-center text-white font-semibold">
                            {worker?.full_name?.charAt(0) || '?'}
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <h3 className="text-white font-semibold">{worker?.full_name}</h3>
                              {posMatch && (
                                <span className="bg-green-500/20 text-green-400 text-xs px-2 py-1 rounded-full">
                                  Knows {business.pos_system}
                                </span>
                              )}
                              {interest.status === 'accepted' && (
                                <span className="bg-green-500 text-white text-xs px-2 py-1 rounded-full">
                                  Accepted
                                </span>
                              )}
                            </div>
                            <p className="text-slate-400 text-sm">{worker?.years_experience || 0} years experience</p>
                            <div className="flex flex-wrap gap-1 mt-2">
                              {worker?.positions?.map(pos => (
                                <span key={pos} className="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded">
                                  {pos}
                                </span>
                              ))}
                            </div>
                            {worker?.certifications?.length > 0 && worker.certifications[0] !== 'None' && (
                              <div className="flex flex-wrap gap-1 mt-1">
                                {worker.certifications.filter(c => c !== 'None').map(cert => (
                                  <span key={cert} className="bg-blue-500/20 text-blue-400 text-xs px-2 py-1 rounded">
                                    {cert}
                                  </span>
                                ))}
                              </div>
                            )}
                            {worker?.preferred_payment_methods?.length > 0 && (
                              <div className="mt-2">
                                <p className="text-slate-500 text-xs mb-1">Preferred Payment:</p>
                                <div className="flex flex-wrap gap-1">
                                  {worker.preferred_payment_methods.map(method => (
                                    <span key={method} className="bg-purple-500/20 text-purple-400 text-xs px-2 py-1 rounded">
                                      💳 {method}
                                    </span>
                                  ))}
                                </div>
                              </div>
                            )}
                            {worker?.phone && (
                              <p className="text-slate-500 text-sm mt-2">📞 {worker.phone}</p>
                            )}
                          </div>
                        </div>
                        {shift.status === 'open' && (
                          <button
                            onClick={() => acceptWorker(interest)}
                            disabled={loading}
                            className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-xl font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
                          >
                            {loading ? 'Accepting...' : 'Accept'}
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>
        </div>
      );
    }

    // Worker Dashboard
    function WorkerDashboard({ user: initialUser, onLogout }) {
      const [user, setUser] = useState(initialUser);
      const [shifts, setShifts] = useState([]);
      const [myInterests, setMyInterests] = useState([]);
      const [myAcceptedShifts, setMyAcceptedShifts] = useState([]);
      const [myPastShifts, setMyPastShifts] = useState([]);
      const [shiftTab, setShiftTab] = useState('available');
      const [loading, setLoading] = useState(true);
      const [available, setAvailable] = useState(initialUser.available);
      const [showSettings, setShowSettings] = useState(false);
      const [acceptedAlert, setAcceptedAlert] = useState(null);
      const [rejectedAlert, setRejectedAlert] = useState(null);
      const [cancelledAlert, setCancelledAlert] = useState(null);
      const [selectedBusiness, setSelectedBusiness] = useState(null);
      const knownAcceptedCountRef = React.useRef(-1); // -1 means not initialized yet
      const knownRejectedCountRef = React.useRef(-1); // -1 means not initialized yet
      const knownShiftCountRef = React.useRef(-1); // Track shift count for auto-refresh
      const knownInterestedShiftIdsRef = React.useRef(new Set()); // Track which shifts worker is interested in

      // Request notification permission on mount
      useEffect(() => {
        if ('Notification' in window) {
          if (Notification.permission === 'default') {
            Notification.requestPermission().then(permission => {
              if (permission === 'granted') {
              }
            });
          } else if (Notification.permission === 'denied') {
          }
        }
      }, []);

      const checkForAcceptedShifts = React.useCallback(async () => {
        // Check for accepted interests with shift details
        const { data: acceptedInterests, error: acceptedError } = await supabase
          .from('interests')
          .select(`
            id, 
            status,
            shift:shifts(id, position, shift_date, start_time, end_time)
          `)
          .eq('worker_id', user.id)
          .eq('status', 'accepted');
        
        if (acceptedError) {
          // Error checking accepted shifts - silently continue
        }
        
        const acceptedCount = acceptedInterests?.length || 0;
        
        // Check if we lost an accepted shift (was unfilled by business)
        if (acceptedCount < knownAcceptedCountRef.current && knownAcceptedCountRef.current > 0) {
          const formatDate = (date) => new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          const formatTime = (time) => {
            const [h, m] = time.split(':');
            const hour = parseInt(h);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const hour12 = hour % 12 || 12;
            return `${hour12}:${m} ${ampm}`;
          };

          // Get current shifts that are filled by this worker
          const { data: currentAcceptedShifts } = await supabase
            .from('shifts')
            .select('id, position, shift_date, start_time, end_time')
            .eq('filled_by', user.id)
            .order('shift_date', { ascending: true });

          // Compare with myAcceptedShifts to find which one was released
          const currentShiftIds = new Set((currentAcceptedShifts || []).map(s => s.id));
          const previousShiftIds = new Set((myAcceptedShifts || []).map(s => s.id));
          
          // Find the shift that was released (in previous but not in current)
          const releasedShiftId = Array.from(previousShiftIds).find(id => !currentShiftIds.has(id));
          const releasedShift = myAcceptedShifts?.find(s => s.id === releasedShiftId);
          
          const lostCount = knownAcceptedCountRef.current - acceptedCount;
          
          let alertMessage = '';
          let notificationBody = '';
          
          if (lostCount === 1 && releasedShift) {
            const dateStr = formatDate(releasedShift.shift_date);
            const timeStr = `${formatTime(releasedShift.start_time)} - ${formatTime(releasedShift.end_time)}`;
            alertMessage = `⚠️ A business released you from the ${releasedShift.position} shift (${dateStr}, ${timeStr}). The shift is now open again.`;
            notificationBody = `A business released you from the ${releasedShift.position} shift (${dateStr}, ${timeStr}). The shift is now open again.`;
          } else if (lostCount === 1) {
            alertMessage = `⚠️ A business released you from 1 shift. The shift is now open again.`;
            notificationBody = `A business released you from 1 shift. The shift is now open again.`;
          } else {
            alertMessage = `⚠️ A business released you from ${lostCount} shifts. The shifts are now open again.`;
            notificationBody = `A business released you from ${lostCount} shifts. The shifts are now open again.`;
          }

          setRejectedAlert(alertMessage);
          
          // Browser notification
          if ('Notification' in window && Notification.permission === 'granted') {
            try {
              new Notification('LastCall - Shift Released', {
                body: notificationBody,
                icon: '⚠️',
                badge: '⚠️',
                tag: 'shift-released'
              });
            } catch (err) {
              // Notification error - silently continue
            }
          }
          
          // Reload data to update shift status
          loadData();
          
          // Auto-dismiss after 10 seconds
          setTimeout(() => setRejectedAlert(null), 10000);
        } else if (acceptedCount > knownAcceptedCountRef.current && knownAcceptedCountRef.current >= 0) {
          // Newly accepted!
          const newCount = acceptedCount - knownAcceptedCountRef.current;
          setAcceptedAlert(`🎉 You got ${newCount} shift${newCount > 1 ? 's' : ''}!`);
          setShiftTab('upcoming'); // Switch to upcoming tab
          
          // Browser notification
          if ('Notification' in window && Notification.permission === 'granted') {
            try {
              new Notification('LastCall - You got the shift!', {
                body: `A business has accepted you for ${newCount} shift${newCount > 1 ? 's' : ''}!`,
                icon: '🎉',
                badge: '🎉',
                tag: 'shift-accepted'
              });
            } catch (err) {
              // Notification error - silently continue
            }
          }
          
          // Reload data to show new shift
          loadData();
          
          // Auto-dismiss after 8 seconds
          setTimeout(() => setAcceptedAlert(null), 8000);
        }
        knownAcceptedCountRef.current = acceptedCount;

        // Check for rejected interests
        const { data: rejectedInterests, error: rejectedError } = await supabase
          .from('interests')
          .select(`
            id, 
            status,
            shift:shifts(id, position, shift_date)
          `)
          .eq('worker_id', user.id)
          .eq('status', 'rejected');
        
        if (rejectedError) {
          // Error checking rejected shifts - silently continue
        }
        
        const rejectedCount = rejectedInterests?.length || 0;
        
        if (rejectedCount > knownRejectedCountRef.current && knownRejectedCountRef.current >= 0) {
          // Newly rejected!
          const newRejectedCount = rejectedCount - knownRejectedCountRef.current;
          const shiftInfo = rejectedInterests[0]?.shift;
          const shiftText = shiftInfo ? ` for ${shiftInfo.position} shift` : '';
          setRejectedAlert(`❌ Someone else was picked${shiftText}. Keep looking!`);
          
          // Browser notification
          if ('Notification' in window && Notification.permission === 'granted') {
            try {
              new Notification('LastCall - Shift Filled', {
                body: `A business picked someone else${shiftText}. Don't worry, more shifts are available!`,
                icon: '❌',
                badge: '❌',
                tag: 'shift-rejected'
              });
            } catch (err) {
              // Notification error - silently continue
            }
          }
          
          // Reload data to update status
          loadData();
          
          // Auto-dismiss after 10 seconds
          setTimeout(() => setRejectedAlert(null), 10000);
        }
        knownRejectedCountRef.current = rejectedCount;
      }, [user.id]);

      const checkForShiftStatusChanges = React.useCallback(async () => {
        // Check if shifts the worker is interested in have been filled, cancelled, or deleted
        if (knownInterestedShiftIdsRef.current.size === 0) {
          return;
        }

        const interestedShiftIds = Array.from(knownInterestedShiftIdsRef.current);
        
        // Get current status of these shifts
        const { data: currentShifts, error } = await supabase
          .from('shifts')
          .select('id, position, status, shift_date')
          .in('id', interestedShiftIds);

        if (error) {
          return;
        }

        // Check which interests are already rejected (to avoid duplicate notifications)
        const { data: rejectedInterests } = await supabase
          .from('interests')
          .select('shift_id')
          .eq('worker_id', user.id)
          .eq('status', 'rejected')
          .in('shift_id', interestedShiftIds);

        const rejectedShiftIds = new Set((rejectedInterests || []).map(i => i.shift_id));

        // Find shifts that are no longer open (filled, cancelled, or deleted)
        const currentShiftIds = new Set((currentShifts || []).map(s => s.id));
        const filledOrCancelled = (currentShifts || []).filter(s => s.status !== 'open');
        const deleted = interestedShiftIds.filter(id => !currentShiftIds.has(id));

        // Get worker's accepted shifts to check if they got the shift
        const { data: myAcceptedShiftsData } = await supabase
          .from('shifts')
          .select('id')
          .eq('filled_by', user.id)
          .in('id', interestedShiftIds);

        const myAcceptedShiftIds = new Set((myAcceptedShiftsData || []).map(s => s.id));

        // Check if any shifts were filled by someone else (not this worker)
        // BUT skip if the interest is already marked as rejected (to avoid duplicate with rejected alert)
        const newlyFilled = filledOrCancelled.filter(s => 
          s.status === 'filled' && 
          !myAcceptedShiftIds.has(s.id) &&
          !rejectedShiftIds.has(s.id) // Skip if already rejected (will be handled by rejected alert)
        );

        // Check if any shifts were cancelled
        const newlyCancelled = filledOrCancelled.filter(s => s.status === 'cancelled');

        // Show alerts for newly filled/cancelled/deleted shifts
        if (newlyFilled.length > 0 || newlyCancelled.length > 0 || deleted.length > 0) {
          const messages = [];
          
          if (newlyFilled.length > 0) {
            const shiftText = newlyFilled.length === 1 
              ? `the ${newlyFilled[0].position} shift`
              : `${newlyFilled.length} shifts`;
            messages.push(`❌ ${shiftText} ${newlyFilled.length === 1 ? 'was' : 'were'} filled by someone else`);
          }
          
          if (newlyCancelled.length > 0) {
            const shiftText = newlyCancelled.length === 1 
              ? `the ${newlyCancelled[0].position} shift`
              : `${newlyCancelled.length} shifts`;
            messages.push(`🚫 ${shiftText} ${newlyCancelled.length === 1 ? 'was' : 'were'} cancelled`);
          }
          
          if (deleted.length > 0) {
            messages.push(`🗑️ ${deleted.length} shift${deleted.length > 1 ? 's' : ''} ${deleted.length === 1 ? 'was' : 'were'} removed`);
          }

          if (messages.length > 0) {
            setCancelledAlert(messages.join('. '));
            
            // Browser notification
            if ('Notification' in window && Notification.permission === 'granted') {
              try {
                new Notification('LastCall - Shift Update', {
                  body: messages.join('. '),
                  icon: '⚠️',
                  badge: '⚠️',
                  tag: 'shift-update'
                });
              } catch (err) {
                // Notification error - silently continue
              }
            }

            // Reload data to remove these shifts from the list
            loadData();
            
            // Auto-dismiss after 10 seconds
            setTimeout(() => setCancelledAlert(null), 10000);
          }

          // Update known interested shifts - remove the ones that are no longer open
          filledOrCancelled.forEach(s => knownInterestedShiftIdsRef.current.delete(s.id));
          deleted.forEach(id => knownInterestedShiftIdsRef.current.delete(id));
        }
      }, [user.id]);

      const checkForNewShifts = React.useCallback(async () => {
        // Check for new shifts that match worker's positions
        const now = new Date();
        const today = now.toISOString().split('T')[0];
        const currentTime = now.toTimeString().slice(0, 5);

        const shiftHasEnded = (shift) => {
          if (shift.shift_date < today) return true;
          if (shift.shift_date === today && shift.end_time <= currentTime) return true;
          return false;
        };

        const { data: shiftsData, error } = await supabase
          .from('shifts')
          .select('id, position, shift_date, end_time')
          .eq('status', 'open')
          .gte('shift_date', today)
          .order('shift_date', { ascending: true });

        if (error) {
          // Error checking for new shifts - silently continue
          return;
        }

        const filtered = (shiftsData || []).filter(shift => 
          user.positions?.includes(shift.position) && !shiftHasEnded(shift)
        );

        const currentShiftCount = filtered.length;

        // If new shifts appeared, reload data and show notification
        if (currentShiftCount > knownShiftCountRef.current && knownShiftCountRef.current >= 0) {
          const newShiftCount = currentShiftCount - knownShiftCountRef.current;
          
          // Browser notification for new shifts
          if ('Notification' in window && Notification.permission === 'granted') {
            try {
              new Notification('LastCall - New Shifts Available!', {
                body: `${newShiftCount} new shift${newShiftCount > 1 ? 's' : ''} available!`,
                icon: '📋',
                badge: '📋',
                tag: 'new-shifts'
              });
            } catch (err) {
              // Notification error - silently continue
            }
          }
          
          loadData();
        }
        
        knownShiftCountRef.current = currentShiftCount;
      }, [user.positions]);

      useEffect(() => {
        loadData();
        
        // Poll for accepted/rejected shifts every 15 seconds
        const statusInterval = setInterval(() => {
          checkForAcceptedShifts();
        }, 15000);
        
        // Poll for shift status changes (filled/cancelled/deleted) every 15 seconds
        const statusChangeInterval = setInterval(() => {
          checkForShiftStatusChanges();
        }, 15000);
        
        // Poll for new shifts every 20 seconds
        const shiftInterval = setInterval(() => {
          checkForNewShifts();
        }, 20000);
        
        return () => {
          clearInterval(statusInterval);
          clearInterval(statusChangeInterval);
          clearInterval(shiftInterval);
        };
      }, [checkForAcceptedShifts, checkForShiftStatusChanges, checkForNewShifts]);

      const loadData = async () => {
        setLoading(true);
        
        try {
          const now = new Date();
          const today = now.toISOString().split('T')[0];
          const currentTime = now.toTimeString().slice(0, 5); // "HH:MM"

          // Helper to check if shift has ended
          const shiftHasEnded = (shift) => {
            if (shift.shift_date < today) return true;
            if (shift.shift_date === today && shift.end_time <= currentTime) return true;
            return false;
          };

          // Load open shifts
          const { data: shiftsData, error: shiftsError } = await supabase
            .from('shifts')
            .select(`
              *,
              business:businesses(*)
            `)
            .eq('status', 'open')
            .gte('shift_date', today)
            .order('shift_date', { ascending: true });

          if (shiftsError) {
            // Continue with empty array if error, but log it
            setShifts([]);
          } else {
            // Filter to positions user works and shifts that haven't ended
            const filtered = (shiftsData || []).filter(shift => 
              user.positions?.includes(shift.position) && !shiftHasEnded(shift)
            );
            
            // Update shift count for auto-refresh tracking
            if (knownShiftCountRef.current >= 0 && filtered.length > knownShiftCountRef.current) {
              // New shifts available - will be handled by checkForNewShifts
              knownShiftCountRef.current = filtered.length;
            } else if (knownShiftCountRef.current < 0) {
              // Initial load
              knownShiftCountRef.current = filtered.length;
            }

            // Sort by POS match
            const sorted = filtered.sort((a, b) => {
              const aMatch = a.business?.pos_system && user.pos_systems?.includes(a.business.pos_system) ? 1 : 0;
              const bMatch = b.business?.pos_system && user.pos_systems?.includes(b.business.pos_system) ? 1 : 0;
              return bMatch - aMatch;
            });

            setShifts(sorted);
            knownShiftCountRef.current = filtered.length;
          }

          // Load my interests
          const { data: interestsData, error: interestsError } = await supabase
            .from('interests')
            .select('shift_id, status')
            .eq('worker_id', user.id);
          
          if (!interestsError) {
            setMyInterests(interestsData || []);
            // Update known interested shift IDs (only for shifts with pending interest)
            const pendingInterests = (interestsData || []).filter(i => !i.status || i.status === 'pending');
            knownInterestedShiftIdsRef.current = new Set(pendingInterests.map(i => i.shift_id));
          }

          // Load ALL my filled shifts, then split into upcoming vs past
          const { data: myShiftsData, error: myShiftsError } = await supabase
            .from('shifts')
            .select(`
              *,
              business:businesses(*)
            `)
            .eq('filled_by', user.id)
            .order('shift_date', { ascending: true });
          
          if (!myShiftsError && myShiftsData) {
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            const currentTime = now.toTimeString().slice(0, 5);
            const shiftHasEnded = (shift) => {
              if (shift.shift_date < today) return true;
              if (shift.shift_date === today && shift.end_time <= currentTime) return true;
              return false;
            };
            
            const upcoming = myShiftsData.filter(shift => !shiftHasEnded(shift));
            const past = myShiftsData.filter(shift => shiftHasEnded(shift)).reverse();
            
            setMyAcceptedShifts(upcoming);
            setMyPastShifts(past);
          }

          // Initialize known accepted count by checking actual accepted interests
          const { data: acceptedInterests, error: acceptedError } = await supabase
            .from('interests')
            .select('id, status')
            .eq('worker_id', user.id)
            .eq('status', 'accepted');
          
          if (!acceptedError) {
            knownAcceptedCountRef.current = acceptedInterests?.length || 0;
          } else {
            // Fallback to interestsData if query fails
            const acceptedCount = (interestsData || []).filter(i => i.status === 'accepted').length;
            knownAcceptedCountRef.current = acceptedCount;
          }

          // Initialize known rejected count
          const { data: rejectedInterests, error: rejectedError } = await supabase
            .from('interests')
            .select('id, status')
            .eq('worker_id', user.id)
            .eq('status', 'rejected');
          
          if (!rejectedError) {
            knownRejectedCountRef.current = rejectedInterests?.length || 0;
          } else {
            const rejectedCount = (interestsData || []).filter(i => i.status === 'rejected').length;
            knownRejectedCountRef.current = rejectedCount;
          }
        } catch (err) {
          // Silently handle errors - don't crash the app
          // Data will be empty but app will still function
        } finally {
          setLoading(false);
        }
      };

      const updateUser = (updatedUser) => {
        setUser(updatedUser);
        localStorage.setItem('lastcall_user', JSON.stringify(updatedUser));
      };

      const toggleAvailable = async () => {
        const newAvailable = !available;
        setAvailable(newAvailable);
        
        // Update localStorage
        const updatedUser = { ...user, available: newAvailable };
        setUser(updatedUser);
        localStorage.setItem('lastcall_user', JSON.stringify(updatedUser));
        
        // Update database
        await supabase
          .from('workers')
          .update({ available: newAvailable })
          .eq('id', user.id);
      };

      const expressInterest = async (shiftId) => {
        await supabase
          .from('interests')
          .insert([{ shift_id: shiftId, worker_id: user.id }]);
        // Add to known interested shifts
        knownInterestedShiftIdsRef.current.add(shiftId);
        loadData();
      };

      const withdrawInterest = async (shiftId) => {
        await supabase
          .from('interests')
          .delete()
          .eq('shift_id', shiftId)
          .eq('worker_id', user.id);
        // Remove from known interested shifts
        knownInterestedShiftIdsRef.current.delete(shiftId);
        loadData();
      };

      const getInterestStatus = (shiftId) => {
        const interest = myInterests.find(i => i.shift_id === shiftId);
        return interest?.status || null;
      };

      const formatDate = (date) => new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const formatTime = (time) => {
        const [h, m] = time.split(':');
        const hour = parseInt(h);
        const ampm = hour >= 12 ? 'PM' : 'AM';
        const hour12 = hour % 12 || 12;
        return `${hour12}:${m} ${ampm}`;
      };

      if (showSettings) {
        return <WorkerSettings user={user} onBack={() => setShowSettings(false)} onSave={(updated) => { updateUser(updated); setShowSettings(false); loadData(); }} />;
      }

      return (
        <div className="min-h-screen bg-slate-900">
          <header className="bg-slate-800 border-b border-slate-700 p-4">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <Logo size="small" />
                <div>
                  <h1 className="text-white font-semibold">{user.full_name}</h1>
                  <p className="text-slate-400 text-sm">{user.positions?.join(', ')}</p>
                </div>
              </div>
              <div className="flex items-center gap-4">

    // Worker Settings Component
    function WorkerSettings({ user, onBack, onSave }) {
      const [fullName, setFullName] = useState(user.full_name || '');
      const [phone, setPhone] = useState(user.phone || '');
      const [yearsExperience, setYearsExperience] = useState(user.years_experience || '');
      const [selectedPOS, setSelectedPOS] = useState(user.pos_systems || []);
      const [selectedPositions, setSelectedPositions] = useState(user.positions || []);
      const [selectedCerts, setSelectedCerts] = useState(user.certifications || []);
      const [preferredPaymentMethods, setPreferredPaymentMethods] = useState(user.preferred_payment_methods || []);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      
      const PAYMENT_METHODS = ['Cash', 'Venmo', 'PayPal', 'Zelle', 'Cash App', 'Check', 'Other'];

      const toggleSelection = (item, selected, setSelected) => {
        if (selected.includes(item)) {
          setSelected(selected.filter(i => i !== item));
        } else {
          setSelected([...selected, item]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        setSuccess('');

        if (selectedPositions.length === 0) {
          setError('Please select at least one position');
          setLoading(false);
          return;
        }

        const { data, error: updateError } = await supabase
          .from('workers')
          .update({
            full_name: fullName,
            phone,
            years_experience: parseInt(yearsExperience) || 0,
            pos_systems: selectedPOS,
            positions: selectedPositions,
            certifications: selectedCerts,
            preferred_payment_methods: preferredPaymentMethods
          })
          .eq('id', user.id)
          .select()
          .single();

        if (updateError) {
          setError(updateError.message);
          setLoading(false);
          return;
        }

        setSuccess('Profile saved!');
        setLoading(false);
        setTimeout(() => onSave(data), 1000);
      };

      return (
        <div className="min-h-screen bg-slate-900 overflow-y-auto">
          <header className="bg-slate-800 border-b border-slate-700 p-4">
            <div className="max-w-4xl mx-auto flex items-center gap-4">
              <button onClick={onBack} className="text-slate-400 hover:text-white">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                </svg>
              </button>
              <h1 className="text-xl font-bold text-white">Edit Profile</h1>
            </div>
          </header>

          <main className="max-w-lg mx-auto p-4 pb-12">
            <form onSubmit={handleSubmit} className="bg-slate-800 rounded-2xl p-6 space-y-4">
              {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm">{error}</div>}
              {success && <div className="bg-green-500/20 text-green-300 p-3 rounded-lg text-sm">{success}</div>}

              <div>
                <label className="text-slate-300 text-sm">Full Name</label>
                <input
                  type="text"
                  value={fullName}
                  onChange={(e) => setFullName(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  required
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">Phone</label>
                <input
                  type="tel"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">Years of Experience</label>
                <input
                  type="number"
                  value={yearsExperience}
                  onChange={(e) => setYearsExperience(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  min="0"
                  max="50"
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm mb-2 block">Positions (select all that apply)</label>
                <div className="flex flex-wrap gap-2">
                  {POSITIONS.map(pos => (
                    <button
                      key={pos}
                      type="button"
                      onClick={() => toggleSelection(pos, selectedPositions, setSelectedPositions)}
                      className={`px-3 py-2 rounded-lg text-sm transition-all ${
                        selectedPositions.includes(pos)
                          ? 'bg-brand-500 text-white'
                          : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                      }`}
                    >
                      {pos}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-slate-300 text-sm mb-2 block">POS Systems You Know</label>
                <div className="flex flex-wrap gap-2">
                  {POS_SYSTEMS.map(pos => (
                    <button
                      key={pos}
                      type="button"
                      onClick={() => toggleSelection(pos, selectedPOS, setSelectedPOS)}
                      className={`px-3 py-2 rounded-lg text-sm transition-all ${
                        selectedPOS.includes(pos)
                          ? 'bg-green-500 text-white'
                          : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                      }`}
                    >
                      {pos}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-slate-300 text-sm mb-2 block">Certifications</label>
                <div className="flex flex-wrap gap-2">
                  {CERTIFICATIONS.map(cert => (
                    <button
                      key={cert}
                      type="button"
                      onClick={() => toggleSelection(cert, selectedCerts, setSelectedCerts)}
                      className={`px-3 py-2 rounded-lg text-sm transition-all ${
                        selectedCerts.includes(cert)
                          ? 'bg-blue-500 text-white'
                          : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                      }`}
                    >
                      {cert}
                    </button>
                  ))}
                </div>
              </div>

              <div className="mt-4">
                <label className="text-slate-300 text-sm mb-2 block font-semibold">Preferred Payment Methods</label>
                <p className="text-slate-400 text-xs mb-3">Select all that apply - Let businesses know how you prefer to be paid</p>
                <div className="flex flex-wrap gap-2">
                  {PAYMENT_METHODS.map(method => (
                    <button
                      key={method}
                      type="button"
                      onClick={() => toggleSelection(method, preferredPaymentMethods, setPreferredPaymentMethods)}
                      className={`px-3 py-2 rounded-lg text-sm transition-all ${
                        preferredPaymentMethods.includes(method)
                          ? 'bg-purple-500 text-white'
                          : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                      }`}
                    >
                      {method}
                    </button>
                  ))}
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-semibold py-3 rounded-xl transition-all disabled:opacity-50"
              >
                {loading ? 'Saving...' : 'Save Changes'}
              </button>
            </form>
          </main>
        </div>
      );
    }

    // Past Shift Card Component (with completion tracking)
    function PastShiftCard({ shift, onUpdate }) {
      const [showPaymentForm, setShowPaymentForm] = useState(false);
      // Try to get payment info from dedicated fields, fallback to parsing notes if needed
      const getPaymentInfo = () => {
        if (shift.payment_method || shift.amount_paid || shift.tips_paid || shift.payment_notes) {
          return {
            method: shift.payment_method || '',
            amount: shift.amount_paid || '',
            tips: shift.tips_paid || '',
            notes: shift.payment_notes || ''
          };
        }
        // Fallback: try to parse from notes field if it contains payment info
        return { method: '', amount: '', tips: '', notes: '' };
      };
      
      const paymentInfo = getPaymentInfo();
      const [paymentMethod, setPaymentMethod] = useState(paymentInfo.method);
      const [amountPaid, setAmountPaid] = useState(paymentInfo.amount ? paymentInfo.amount.toString() : '');
      const [tipsPaid, setTipsPaid] = useState(paymentInfo.tips ? paymentInfo.tips.toString() : '');
      const [paymentNotes, setPaymentNotes] = useState(paymentInfo.notes);
      const [isCompleted, setIsCompleted] = useState(shift.completed || false);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');

      const markCompleted = async () => {
        setSaving(true);
        setError('');
        
        // Build update data - only include fields that exist in database
        const updateData = {
          completed: true
        };
        
        // Add payment fields if they have values (will work once migration is run)
        if (paymentMethod) updateData.payment_method = paymentMethod;
        if (amountPaid) updateData.amount_paid = parseFloat(amountPaid);
        if (tipsPaid) updateData.tips_paid = parseFloat(tipsPaid);
        if (paymentNotes) updateData.payment_notes = paymentNotes;

        const { error: updateError } = await supabase
          .from('shifts')
          .update(updateData)
          .eq('id', shift.id);

        if (updateError) {
          // If fields don't exist yet, try storing in notes as fallback
          if (updateError.message.includes('column') && updateError.message.includes('does not exist')) {
            const paymentInfoText = `PAYMENT: Method=${paymentMethod || 'N/A'}, Amount=$${amountPaid || '0'}, Tips=$${tipsPaid || '0'}, Notes=${paymentNotes || 'None'}`;
            const existingNotes = shift.notes || '';
            const combinedNotes = existingNotes ? `${existingNotes}\n\n${paymentInfoText}` : paymentInfoText;
            
            const { error: fallbackError } = await supabase
              .from('shifts')
              .update({ 
                completed: true,
                notes: combinedNotes 
              })
              .eq('id', shift.id);
            
            if (fallbackError) {
              setError('Failed to save payment info. Please run the database migration.');
              setSaving(false);
              return;
            }
          } else {
            setError(updateError.message);
            setSaving(false);
            return;
          }
        }

        setIsCompleted(true);
        setShowPaymentForm(false);
        setSaving(false);
        onUpdate();
      };

      const formatDate = (date) => new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

      if (showPaymentForm) {
        return (
          <div className="bg-slate-800 rounded-2xl p-4">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-white font-semibold">Mark as Completed & Add Payment</h3>
              <button onClick={() => setShowPaymentForm(false)} className="text-slate-400 hover:text-white">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            
            {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg text-sm mb-4">{error}</div>}

            <div className="space-y-4">
              <div>
                <label className="text-slate-300 text-sm">Payment Method</label>
                <select
                  value={paymentMethod}
                  onChange={(e) => setPaymentMethod(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                >
                  <option value="">Select payment method</option>
                  <option value="Cash">Cash</option>
                  <option value="Venmo">Venmo</option>
                  <option value="PayPal">PayPal</option>
                  <option value="Zelle">Zelle</option>
                  <option value="Cash App">Cash App</option>
                  <option value="Check">Check</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div>
                <label className="text-slate-300 text-sm">Amount Paid - Hourly ($)</label>
                <input
                  type="number"
                  value={amountPaid}
                  onChange={(e) => setAmountPaid(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  min="0"
                  step="0.01"
                  placeholder="0.00"
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">Tips Paid ($)</label>
                <p className="text-slate-400 text-xs mt-1 mb-2">Separate from hourly pay for tax purposes</p>
                <input
                  type="number"
                  value={tipsPaid}
                  onChange={(e) => setTipsPaid(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  min="0"
                  step="0.01"
                  placeholder="0.00"
                />
              </div>

              <div>
                <label className="text-slate-300 text-sm">Payment Notes (optional)</label>
                <textarea
                  value={paymentNotes}
                  onChange={(e) => setPaymentNotes(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:border-brand-500 focus:outline-none"
                  rows={2}
                  placeholder="Any additional payment details..."
                />
              </div>

              <button
                onClick={markCompleted}
                disabled={saving}
                className="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition-all disabled:opacity-50"
              >
                {saving ? 'Saving...' : 'Mark as Completed'}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className={`rounded-2xl p-4 ${isCompleted ? 'bg-slate-800' : 'bg-slate-800/50'} ${!isCompleted ? 'opacity-75' : ''}`}>
          <div className="flex items-start justify-between">
            <div className="flex-1">
              <div className="flex items-center gap-2">
                <h3 className="text-white font-semibold">{shift.position}</h3>
                <span className={`text-xs px-2 py-1 rounded-full ${
                  isCompleted ? 'bg-green-500/20 text-green-400' :
                  shift.status === 'filled' ? 'bg-blue-500/20 text-blue-400' :
                  shift.status === 'cancelled' ? 'bg-red-500/20 text-red-400' :
                  'bg-yellow-500/20 text-yellow-400'
                }`}>
                  {isCompleted ? 'Completed' : shift.status}
                </span>
              </div>
              <div className="mt-2 flex items-center gap-4 text-sm">
                <span className="text-slate-400">📅 {formatDate(shift.shift_date)}</span>
                <span className="text-slate-400">${shift.hourly_rate}/hr{shift.tips_included && ' + tips'}</span>
              </div>
              {shift.filled_by && (
                <p className="text-slate-400 text-sm mt-1">Worker ID: {shift.filled_by}</p>
              )}
              {isCompleted && (
                <div className="mt-3 pt-3 border-t border-slate-700">
                  {(paymentMethod || amountPaid || tipsPaid || paymentNotes) && (
                    <>
                      {paymentMethod && (
                        <p className="text-slate-300 text-sm">💳 Payment Method: {paymentMethod}</p>
                      )}
                      {amountPaid && (
                        <p className="text-slate-300 text-sm">💰 Hourly Pay: ${parseFloat(amountPaid).toFixed(2)}</p>
                      )}
                      {tipsPaid && (
                        <p className="text-slate-300 text-sm">💵 Tips: ${parseFloat(tipsPaid).toFixed(2)}</p>
                      )}
                      {paymentNotes && (
                        <p className="text-slate-400 text-xs mt-1">📝 {paymentNotes}</p>
                      )}
                    </>
                  )}
                </div>
              )}
            </div>
            {!isCompleted && shift.status === 'filled' && (
              <button
                onClick={() => setShowPaymentForm(true)}
                className="ml-4 bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-xl font-semibold text-sm"
              >
                Mark Paid
              </button>
            )}
          </div>
        </div>
      );
    }

    // Shift Card Component
    function ShiftCard({ shift, onClick, showStatus }) {
      const formatDate = (date) => new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const formatTime = (time) => {
        const [h, m] = time.split(':');
        const hour = parseInt(h);
        const ampm = hour >= 12 ? 'PM' : 'AM';
        const hour12 = hour % 12 || 12;
        return `${hour12}:${m} ${ampm}`;
      };

      return (
        <div 
          onClick={onClick}
          className="bg-slate-800 rounded-2xl p-4 cursor-pointer hover:bg-slate-750 transition-all"
        >
          <div className="flex items-start justify-between">
            <div>
              <div className="flex items-center gap-2">
                <h3 className="text-white font-semibold">{shift.position}</h3>
                {showStatus && (
                  <span className={`text-xs px-2 py-1 rounded-full ${
                    shift.status === 'filled' ? 'bg-green-500/20 text-green-400' :
                    shift.status === 'cancelled' ? 'bg-red-500/20 text-red-400' :
                    'bg-yellow-500/20 text-yellow-400'
                  }`}>
                    {shift.status}
                  </span>
                )}
              </div>
              <div className="mt-2 flex items-center gap-4 text-sm">
                <span className="text-slate-300">📅 {formatDate(shift.shift_date)}</span>
                <span className="text-slate-300">🕐 {formatTime(shift.start_time)} - {formatTime(shift.end_time)}</span>
                <span className="text-green-400 font-semibold">
                  ${shift.hourly_rate}/hr{shift.tips_included && ' + tips'}
                </span>
              </div>
            </div>
            <svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
